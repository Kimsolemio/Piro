<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 강의록 요약 (V6.0.0 - Pro Edition)</title>
    
    <!-- Tailwind CSS with Typography plugin for Markdown rendering -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(ellipse 80% 80% at 50% -20%, rgba(56, 189, 248, 0.15), rgba(255, 255, 255, 0));
            min-height: 100vh;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .pulse-live { animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            50% { box-shadow: 0 0 0 15px rgba(220, 38, 38, 0); }
        }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(51, 65, 85, 0.6);
        }
        
        select option { background-color: #1e293b; color: #e2e8f0; }

        /* Tooltip CSS */
        .save-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background-color: #334155;
            color: #cbd5e1;
            border-radius: 9999px;
            border: 1px solid #475569;
            transition: all 0.2s;
        }
        .save-btn:hover:not(:disabled) {
            background-color: #475569;
            color: #ffffff;
        }
        .save-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .tooltip {
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #0f172a;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
            border: 1px solid #334155;
            z-index: 10;
        }
        .group:hover .tooltip { opacity: 1; }

        /* Customizing Tailwind Typography for dark mode */
        .prose-invert h1, .prose-invert h2, .prose-invert h3 { color: #f8fafc; }
        .prose-invert strong { color: #e2e8f0; }
        
        .premium-border {
            position: relative;
        }
        .premium-border::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            background: linear-gradient(to right, #3b82f6, #8b5cf6, #ec4899);
            z-index: -1;
            opacity: 0.5;
        }
    </style>
</head>
<body class="text-slate-200 antialiased selection:bg-indigo-500/30">
    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        
        <header class="text-center mb-10 mt-6">
            <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-br from-white to-slate-400 bg-clip-text text-transparent tracking-tight">
                AI 강의록 요약 
                <span class="inline-block text-sm md:text-lg font-bold text-sky-400 align-top ml-2 border border-sky-500/40 bg-sky-500/10 px-3 py-1 rounded-md mb-2 md:mb-0 shadow-[0_0_15px_rgba(56,189,248,0.3)]">
                    V6.1 Gemini 3.1
                </span>
            </h1>
            <p class="text-slate-400 mt-4 max-w-2xl mx-auto leading-relaxed">
                <b>최신 Gemini 3.1 모델 적용.</b> 무료로 제공되는 3.1 Flash로 초고속 실시간 요약을, 필요시 유료 3.1 Pro로 완벽한 최종 정리를 경험하세요!
            </p>
        </header>

        <!-- 설정 영역 -->
        <div class="grid grid-cols-1 gap-6 max-w-5xl mx-auto mb-10">
            <!-- API 키 입력부 -->
            <div class="glass-panel p-5 rounded-xl shadow-lg premium-border">
                <label for="apiKey" class="block text-sm font-medium text-slate-300 mb-2 flex justify-between items-center">
                    <span class="flex items-center gap-2"><i data-lucide="key" class="h-4 w-4 text-amber-400"></i> Google AI Studio API 키 <span class="text-xs text-slate-500 font-normal">(개인 키 입력 시 Pro 모델 사용 가능)</span></span>
                </label>
                <div class="relative">
                    <input type="password" id="apiKey" class="bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 block w-full p-3 pr-10 transition-all" placeholder="API 키를 입력하세요 (미입력 시 제한된 기본 키로 동작합니다)">
                    <button id="toggleApiKey" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-white transition-colors outline-none">
                        <span id="eyeIconWrapper"><i data-lucide="eye" class="h-5 w-5"></i></span>
                    </button>
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <!-- 실시간 모델 선택 -->
                <div class="glass-panel p-5 rounded-xl shadow-lg">
                    <label for="realtimeModelSelect" class="block text-sm font-medium text-slate-400 mb-2 flex items-center gap-2">
                        <i data-lucide="zap" class="h-4 w-4 text-amber-400"></i> 실시간 요약 모델 (속도 중시)
                    </label>
                    <div class="relative">
                        <select id="realtimeModelSelect" class="bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 block w-full p-3 appearance-none cursor-pointer outline-none transition-all">
                            <option value="gemini-3.1-flash" selected>Gemini 3.1 Flash (무료/권장)</option>
                            <option value="gemini-2.5-flash-preview-09-2025">Gemini 2.5 Flash Preview</option>
                            <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                            <i data-lucide="chevron-down" class="h-4 w-4"></i>
                        </div>
                    </div>
                </div>
                
                <!-- 최종 모델 선택 -->
                <div class="glass-panel p-5 rounded-xl shadow-lg">
                    <label for="finalModelSelect" class="block text-sm font-medium text-slate-400 mb-2 flex items-center gap-2">
                        <i data-lucide="brain-circuit" class="h-4 w-4 text-purple-400"></i> 최종 정리 모델 (지능 중시)
                    </label>
                    <div class="relative">
                        <select id="finalModelSelect" class="bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 block w-full p-3 appearance-none cursor-pointer outline-none transition-all">
                            <option value="gemini-3.1-flash" selected>Gemini 3.1 Flash (무료/기본)</option>
                            <option value="gemini-3.1-pro">Gemini 3.1 Pro (유료/개인 키 필요)</option>
                            <option value="gemini-2.5-flash-preview-09-2025">Gemini 2.5 Flash Preview</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
                            <i data-lucide="chevron-down" class="h-4 w-4"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 회의 맥락 정보 -->
            <div class="grid md:grid-cols-2 gap-6">
                 <div class="glass-panel p-5 rounded-xl shadow-lg">
                    <label for="titleInput" class="block text-sm font-medium text-slate-400 mb-2">회의/강의 제목</label>
                    <input type="text" id="titleInput" class="bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 block w-full p-3 transition-all" placeholder="예: 2026년 하반기 AI 서비스 기획 회의">
                </div>
                <div class="glass-panel p-5 rounded-xl shadow-lg">
                    <label for="contextInput" class="block text-sm font-medium text-slate-400 mb-2">사전 맥락 정보 (AI 가이드라인)</label>
                    <textarea id="contextInput" rows="1" class="bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-sky-500 focus:border-sky-500 block w-full p-3 custom-scrollbar transition-all resize-none" placeholder="예: 신규 기능 도입에 관한 의사결정이 필요함."></textarea>
                </div>
            </div>
        </div>

        <!-- 녹음 컨트롤 중앙 배치 -->
        <div class="flex flex-col items-center justify-center mb-12">
            <button id="recordBtn" class="bg-gradient-to-br from-sky-500 to-indigo-600 text-white font-bold h-24 w-24 rounded-full shadow-xl shadow-sky-500/20 hover:from-sky-600 hover:to-indigo-700 focus:outline-none transition-all duration-300 ease-out transform hover:scale-105 flex items-center justify-center group">
                <span id="micIconContainer" class="group-hover:scale-110 transition-transform">
                    <i data-lucide="mic" class="h-10 w-10"></i>
                </span>
            </button>
            <div id="status" class="mt-6 text-slate-400 flex items-center space-x-2 bg-slate-800/80 px-4 py-2 rounded-full border border-slate-700 shadow-inner">
                <div id="status-indicator" class="h-2.5 w-2.5 rounded-full bg-slate-500 transition-colors duration-500"></div>
                <span id="status-text" class="font-medium text-sm tracking-wide">시스템 대기 중</span>
            </div>
        </div>

        <!-- 메인 디스플레이 영역 -->
        <main class="grid grid-cols-1 xl:grid-cols-2 gap-8">
            <!-- 1. 실시간 녹취록 -->
            <div class="glass-panel rounded-2xl flex flex-col shadow-xl overflow-hidden border-t border-t-slate-600/30">
                <div class="flex justify-between items-center p-5 border-b border-slate-700/50 bg-slate-900/60">
                    <h2 class="text-lg font-semibold text-white flex items-center gap-2.5">
                        <div class="p-1.5 bg-sky-500/20 rounded-md border border-sky-500/30"><i data-lucide="mic-2" class="h-5 w-5 text-sky-400"></i></div>
                        실시간 녹취 스트림
                    </h2>
                    <div class="flex items-center gap-3">
                        <button id="saveTranscriptTxtBtn" disabled class="save-btn group">
                            <i data-lucide="download" class="h-4 w-4"></i>
                            <span class="tooltip">TXT 다운로드</span>
                        </button>
                    </div>
                </div>
                <div id="transcript" class="p-6 h-[400px] overflow-y-auto custom-scrollbar text-slate-300 leading-relaxed flex-grow text-base bg-slate-900/30">
                    <div class="h-full flex flex-col items-center justify-center text-slate-500 gap-3 opacity-50">
                        <i data-lucide="message-square-dashed" class="h-8 w-8"></i>
                        <p>중앙의 마이크 버튼을 눌러 녹음을 시작하세요.</p>
                    </div>
                </div>
            </div>

            <!-- 2. 실시간 컨텍스트 요약 -->
            <div class="glass-panel rounded-2xl flex flex-col shadow-xl overflow-hidden border-t border-t-slate-600/30">
                <div class="flex justify-between items-center p-5 border-b border-slate-700/50 bg-slate-900/60">
                    <h2 class="text-lg font-semibold text-white flex items-center gap-2.5">
                        <div class="p-1.5 bg-amber-500/20 rounded-md border border-amber-500/30"><i data-lucide="sparkles" class="h-5 w-5 text-amber-400"></i></div>
                        스마트 컨텍스트 요약
                    </h2>
                     <div class="flex items-center gap-3">
                        <div id="interimSummaryLoader" class="hidden flex items-center gap-2 text-xs font-medium text-amber-400/80 bg-amber-400/10 px-3 py-1.5 rounded-full border border-amber-400/20">
                            <i data-lucide="loader-circle" class="h-3 w-3 animate-spin"></i> 분석 중
                        </div>
                        <button id="saveInterimSummaryTxtBtn" disabled class="save-btn group">
                            <i data-lucide="download" class="h-4 w-4"></i>
                            <span class="tooltip">요약본 다운로드</span>
                        </button>
                    </div>
                </div>
                <div id="interimSummary" class="p-6 h-[400px] overflow-y-auto custom-scrollbar text-slate-300 flex-grow bg-slate-900/30">
                     <div class="h-full flex flex-col items-center justify-center text-slate-500 gap-3 opacity-50">
                        <i data-lucide="zap" class="h-8 w-8"></i>
                        <p>일정 길이의 대화가 쌓이면 <span class="font-bold text-amber-400/70">Flash 모델</span>이 즉시 요약합니다.</p>
                    </div>
                </div>
            </div>
            
            <!-- 3. 최종 정리 노트 (Markdown Rendered) -->
            <div class="xl:col-span-2 glass-panel rounded-2xl flex flex-col shadow-xl overflow-hidden border-t border-t-slate-600/30">
                <div class="flex justify-between items-center p-5 border-b border-slate-700/50 bg-slate-900/60">
                    <h2 class="text-lg font-semibold text-white flex items-center gap-2.5">
                        <div class="p-1.5 bg-purple-500/20 rounded-md border border-purple-500/30"><i data-lucide="book-open-check" class="h-5 w-5 text-purple-400"></i></div>
                        최종 마크다운 노트 <span id="finalModelBadge" class="hidden ml-2 text-[10px] font-bold bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded uppercase border border-purple-500/30">PRO</span>
                    </h2>
                    <div class="flex items-center gap-3">
                        <button id="saveFinalSummaryDocBtn" disabled class="save-btn group w-auto px-4 gap-2 font-medium text-sm border-sky-600/50 hover:bg-sky-600/30 hover:border-sky-500">
                            <i data-lucide="file-word" class="h-4 w-4"></i> Word로 내보내기
                        </button>
                    </div>
                </div>
                <div id="finalSummary" class="p-8 h-auto min-h-[300px] max-h-[600px] overflow-y-auto custom-scrollbar bg-slate-900/40 flex-grow">
                     <div class="h-full flex flex-col items-center justify-center text-slate-500 gap-3 opacity-50 pt-10">
                        <i data-lucide="brain-circuit" class="h-8 w-8"></i>
                        <p>녹음 종료 후, 전체 맥락을 바탕으로 설정된 모델이 완벽한 보고서를 작성합니다.</p>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- 에러 토스트 -->
        <div id="error-message" class="fixed bottom-6 right-6 bg-rose-900/95 backdrop-blur-md text-white py-4 px-5 rounded-xl shadow-[0_10px_30px_rgba(225,29,72,0.3)] z-50 flex items-start gap-3 max-w-md transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none border border-rose-500/50">
            <i data-lucide="triangle-alert" class="h-5 w-5 flex-shrink-0 mt-0.5 text-rose-300"></i>
            <span id="error-text" class="text-sm font-medium leading-relaxed"></span>
        </div>
    </div>

    <script>
        // System Environment Constants
        const defaultApiKey = ""; // Provided by execution environment if empty

        // DOM Elements
        const recordBtn = document.getElementById('recordBtn');
        const micIconContainer = document.getElementById('micIconContainer'); 
        const statusText = document.getElementById('status-text');
        const statusIndicator = document.getElementById('status-indicator');
        const apiKeyInput = document.getElementById('apiKey');
        const realtimeModelSelect = document.getElementById('realtimeModelSelect');
        const finalModelSelect = document.getElementById('finalModelSelect');
        const titleInput = document.getElementById('titleInput');
        const contextInput = document.getElementById('contextInput');
        
        const transcriptDiv = document.getElementById('transcript');
        const interimSummaryDiv = document.getElementById('interimSummary');
        const finalSummaryDiv = document.getElementById('finalSummary');
        const finalModelBadge = document.getElementById('finalModelBadge');
        const errorToast = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');

        // State variables
        let isRecording = false;
        let recognition;
        let fullTranscript = '';
        let transcriptHTML = '';
        let lastProcessedLength = 0;
        let isSummarizing = false;
        let summaryInterval = null;
        
        let summaryHistory = [];
        let finalSummaryRawMarkdown = '';

        lucide.createIcons();

        // --- Utility Functions ---

        function showError(message) {
            console.error("App Error:", message);
            errorText.textContent = message;
            errorToast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                errorToast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 6000);
        }

        function updateStatus(text, state) {
            statusText.textContent = text;
            if (state === 'recording') {
                statusIndicator.className = 'h-2.5 w-2.5 rounded-full bg-rose-500 shadow-[0_0_10px_rgba(244,63,94,0.8)]';
            } else if (state === 'processing') {
                statusIndicator.className = 'h-2.5 w-2.5 rounded-full bg-purple-500 shadow-[0_0_10px_rgba(168,85,247,0.8)] animate-pulse';
            } else {
                statusIndicator.className = 'h-2.5 w-2.5 rounded-full bg-slate-500';
            }
        }

        function downloadFile(content, filename, mimeType) {
            try {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
            } catch (e) {
                showError("파일 저장 중 오류가 발생했습니다.");
            }
        }

        document.getElementById('saveTranscriptTxtBtn').addEventListener('click', () => {
            downloadFile(fullTranscript, '녹취록_원본.txt', 'text/plain;charset=utf-8');
        });

        document.getElementById('saveInterimSummaryTxtBtn').addEventListener('click', () => {
            const content = "--- 실시간 요약 기록 ---\n\n" + summaryHistory.join('\n\n---\n\n');
            downloadFile(content, '실시간_요약본.txt', 'text/plain;charset=utf-8');
        });

        document.getElementById('saveFinalSummaryDocBtn').addEventListener('click', () => {
            if (!finalSummaryRawMarkdown) return;
            const htmlContent = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'><title>강의 노트</title></head>
            <body style="font-family: 'Malgun Gothic', sans-serif;">
                ${marked.parse(finalSummaryRawMarkdown)}
            </body>
            </html>`;
            downloadFile(htmlContent, '최종_강의노트.doc', 'application/msword;charset=utf-8');
        });

        // --- API Logic ---

        function getActiveApiKey() {
            const inputKey = apiKeyInput.value.trim();
            return inputKey ? inputKey.split(',')[0].trim() : defaultApiKey;
        }

        async function fetchWithBackoff(url, options, retries = 3) {
            const delays = [1000, 3000, 6000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errBody = await response.text();
                        if (response.status === 400 && errBody.includes("API key not valid")) {
                            throw new Error("유효하지 않은 API 키입니다. Google AI Studio에서 올바른 키를 확인하세요.");
                        }
                        if (response.status === 404) {
                            throw new Error("선택하신 모델을 사용할 수 있는 권한이 없습니다. (무료 키의 경우 Pro 모델 접근이 제한될 수 있습니다.)");
                        }
                        throw new Error(`HTTP ${response.status}: ${errBody}`);
                    }
                    return await response.json();
                } catch (err) {
                    if (i === retries - 1 || err.message.includes("유효하지 않은") || err.message.includes("권한이 없습니다")) {
                        throw err; 
                    }
                    console.warn(`API 호출 재시도 ${i + 1}/${retries}... (${delays[i]}ms 대기)`);
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        async function callGeminiAPI(modelName, systemPrompt, userText) {
            const currentKey = getActiveApiKey();
            if (!currentKey) {
                showError("API 키가 설정되지 않았습니다.");
                return null;
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${currentKey}`;

            const payload = {
                systemInstruction: { parts: [{ text: systemPrompt }] },
                contents: [{ parts: [{ text: userText }] }],
                generationConfig: { temperature: 0.2 }
            };

            try {
                const data = await fetchWithBackoff(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                return data.candidates?.[0]?.content?.parts?.[0]?.text || null;
            } catch (error) {
                showError(`AI 요약 생성 실패: ${error.message}`);
                return null;
            }
        }

        // --- Summarization Features ---

        async function processInterimSummary() {
            if (isSummarizing || !isRecording) return;
            
            const currentLength = fullTranscript.length;
            const newChunk = fullTranscript.substring(lastProcessedLength).trim();
            
            if (newChunk.length < 80) return; // Need sufficient text

            isSummarizing = true;
            document.getElementById('interimSummaryLoader').classList.remove('hidden');

            const title = titleInput.value.trim() || "회의";
            const context = contextInput.value.trim() || "없음";
            const modelToUse = realtimeModelSelect.value;
            
            const systemPrompt = `당신은 탁월한 통찰력을 가진 전문 속기사입니다.
[주제]: ${title}
[사전 배경지식]: ${context}

지침:
1. 사용자가 전달하는 [새로운 발화 내용]을 파악하여 1~3개의 핵심 불렛포인트(- )로 요약하세요.
2. 짧고 명료하게 작성하며 마크다운을 사용하세요.`;

            let userPrompt = `[새로운 발화 내용]:\n${newChunk}`;
            if (summaryHistory.length > 0) {
                userPrompt = `[이전 요약 참고]:\n${summaryHistory[summaryHistory.length-1]}\n\n` + userPrompt;
            }

            const result = await callGeminiAPI(modelToUse, systemPrompt, userPrompt);
            
            if (result) {
                lastProcessedLength = currentLength; 
                summaryHistory.push(result);
                
                if (summaryHistory.length === 1) interimSummaryDiv.innerHTML = '';

                const summaryBlock = document.createElement('div');
                summaryBlock.className = 'p-5 bg-slate-800/80 rounded-xl border border-slate-700/50 mb-4 shadow-sm animate-fade-in-up';
                summaryBlock.innerHTML = `<div class="prose prose-invert prose-sm prose-slate max-w-none prose-p:leading-relaxed prose-li:my-1 prose-strong:text-sky-300">${marked.parse(result)}</div>`;
                
                interimSummaryDiv.appendChild(summaryBlock);
                interimSummaryDiv.scrollTop = interimSummaryDiv.scrollHeight;
                
                document.getElementById('saveInterimSummaryTxtBtn').disabled = false;
            }

            isSummarizing = false;
            document.getElementById('interimSummaryLoader').classList.add('hidden');
        }

        async function generateFinalSummary() {
            if (fullTranscript.length < 50) {
                showError("녹음된 내용이 너무 짧아 최종 요약을 생성할 수 없습니다.");
                return;
            }

            updateStatus('최종 노트 생성 중...', 'processing');
            finalSummaryDiv.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center text-purple-400 gap-4 py-10">
                    <i data-lucide="loader-circle" class="h-10 w-10 animate-spin"></i>
                    <p class="animate-pulse font-medium tracking-wide">선택된 지능형 모델이 문서 전체를 구조화하고 있습니다...</p>
                </div>
            `;
            lucide.createIcons();

            const title = titleInput.value.trim() || "회의/강의 노트";
            const context = contextInput.value.trim() || "없음";
            const modelToUse = finalModelSelect.value;
            
            // UI 업데이트: 사용된 모델 표시
            if(modelToUse.includes('pro')) {
                finalModelBadge.classList.remove('hidden');
                finalModelBadge.textContent = "PRO MODEL";
            } else {
                finalModelBadge.classList.remove('hidden');
                finalModelBadge.textContent = "FLASH MODEL";
            }

            const systemPrompt = `당신은 최고 수준의 경영 컨설턴트이자 문서 편집자입니다. 제공된 전체 녹취록을 분석하여 완벽하게 구조화된 마크다운 형식의 공식 회의록/노트를 작성하세요.

[회의/강의 제목]: ${title}
[사전 배경지식]: ${context}

요구사항:
1. 문서 최상단에 제목, 생성 일시, 핵심 요약(3줄)을 적은 '개요' 섹션을 만드세요.
2. 전체 내용을 논리적인 주제(Sub-heading)별로 철저히 분류하세요.
3. 주요 결정 사항(Decision), 향후 계획 및 담당자(Action Items)를 별도 섹션으로 강조하여 도출하세요.
4. 비문이나 불필요한 추임새는 모두 정제하여 전문적인 비즈니스 용어로 승화시키세요.`;

            const userPrompt = `[전체 녹취록 원본]:\n${fullTranscript}`;

            const result = await callGeminiAPI(modelToUse, systemPrompt, userPrompt);
            
            if (result) {
                finalSummaryRawMarkdown = result;
                finalSummaryDiv.innerHTML = `
                    <div class="prose prose-invert prose-slate max-w-none prose-headings:text-indigo-200 prose-h1:text-sky-300 prose-a:text-sky-400 prose-strong:text-amber-200 bg-slate-900/60 p-6 md:p-8 rounded-xl border border-slate-700/50 shadow-inner">
                        ${marked.parse(result)}
                    </div>
                `;
                document.getElementById('saveFinalSummaryDocBtn').disabled = false;
                updateStatus('문서 생성 완료', 'idle');
            } else {
                 finalSummaryDiv.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-rose-400 gap-3">
                        <i data-lucide="triangle-alert" class="h-8 w-8"></i>
                        <p>최종 요약 생성에 실패했습니다. (API 키 권한 또는 할당량을 확인하세요)</p>
                    </div>
                 `;
                 updateStatus('오류 발생', 'idle');
            }
            lucide.createIcons();
        }

        // --- Speech Recognition Setup ---

        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (window.SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';

            recognition.onstart = () => { isRecording = true; };

            recognition.onresult = (event) => {
                let interim = '';
                let final = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        final += event.results[i][0].transcript + ' ';
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                
                if (final) {
                    fullTranscript += final;
                    transcriptHTML += `<p class="mb-3 text-slate-200 border-l-2 border-sky-500 pl-3">${final}</p>`;
                    document.getElementById('saveTranscriptTxtBtn').disabled = false;
                }
                
                if (transcriptHTML !== '') {
                    transcriptDiv.innerHTML = transcriptHTML + (interim ? `<p class="text-slate-500 pl-3 font-medium">${interim}</p>` : '');
                    transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed') {
                    showError("마이크 권한이 거부되었습니다.");
                    forceStopRecording();
                }
            };

            recognition.onend = () => {
                if (isRecording) {
                    try { setTimeout(() => { if(isRecording) recognition.start(); }, 300); } 
                    catch(e) {}
                }
            };
        }

        // --- Event Listeners ---

        function forceStopRecording() {
            isRecording = false;
            if(recognition) recognition.stop();
            if(summaryInterval) clearInterval(summaryInterval);
            
            updateStatus('대기 중', 'idle');
            micIconContainer.innerHTML = '<i data-lucide="mic" class="h-10 w-10"></i>';
            recordBtn.classList.remove('from-rose-500', 'to-red-600', 'pulse-live');
            recordBtn.classList.add('from-sky-500', 'to-indigo-600');
            lucide.createIcons();
        }

        async function toggleRecording() {
            if (!window.SpeechRecognition) {
                showError("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용해주세요.");
                return;
            }

            if (isRecording) {
                forceStopRecording();
                if (fullTranscript.length > 50) {
                    await processInterimSummary();
                    generateFinalSummary();
                }
            } else {
                if (!getActiveApiKey()) { 
                    showError('Google AI Studio API 키를 입력해주세요. (설정창 참조)'); 
                    apiKeyInput.focus();
                    return; 
                }

                fullTranscript = ''; transcriptHTML = ''; lastProcessedLength = 0;
                summaryHistory = []; finalSummaryRawMarkdown = '';
                
                transcriptDiv.innerHTML = '<p class="text-slate-400 italic">녹음 중... 말씀하시면 이곳에 기록됩니다.</p>';
                interimSummaryDiv.innerHTML = '<p class="text-slate-400 italic">대기 중...</p>';
                finalSummaryDiv.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-500 gap-3 opacity-50 pt-10">
                        <i data-lucide="brain-circuit" class="h-8 w-8"></i>
                        <p>녹음 종료 후, 전체 맥락을 바탕으로 설정된 모델이 완벽한 보고서를 작성합니다.</p>
                    </div>`;
                finalModelBadge.classList.add('hidden');
                
                document.getElementById('saveTranscriptTxtBtn').disabled = true;
                document.getElementById('saveInterimSummaryTxtBtn').disabled = true;
                document.getElementById('saveFinalSummaryDocBtn').disabled = true;
                
                try {
                    recognition.start();
                    isRecording = true;
                    updateStatus('라이브 녹음 및 분석 중...', 'recording');
                    
                    micIconContainer.innerHTML = '<i data-lucide="square" class="h-8 w-8 fill-current"></i>';
                    recordBtn.classList.remove('from-sky-500', 'to-indigo-600');
                    recordBtn.classList.add('from-rose-500', 'to-red-600', 'pulse-live');
                    lucide.createIcons();

                    // 15초마다 실시간 요약 시도
                    summaryInterval = setInterval(processInterimSummary, 15000);
                } catch(e) {
                    showError("마이크를 시작할 수 없습니다.");
                }
            }
        }

        recordBtn.addEventListener('click', toggleRecording);

        document.getElementById('toggleApiKey').addEventListener('click', () => {
            const iconWrapper = document.getElementById('eyeIconWrapper');
            if (apiKeyInput.type === 'password') {
                apiKeyInput.type = 'text';
                iconWrapper.innerHTML = '<i data-lucide="eye-off" class="h-5 w-5"></i>';
            } else {
                apiKeyInput.type = 'password';
                iconWrapper.innerHTML = '<i data-lucide="eye" class="h-5 w-5"></i>';
            }
            lucide.createIcons();
        });

    </script>
</body>
</html>
