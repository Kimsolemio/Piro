<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 강의록 요약 대시보드</title>

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
    <!-- Firebase v9 compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #0b1329;
            background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59, 130, 246, 0.12), rgba(255, 255, 255, 0));
            min-height: 100vh;
            overflow-x: hidden;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
        
        /* Clean Premium Card Design */
        .premium-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.12);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease;
        }
        .premium-card:hover {
            border-color: rgba(148, 163, 184, 0.22);
            box-shadow: 0 12px 35px -8px rgba(0, 0, 0, 0.6);
        }

        .save-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background-color: rgba(30, 41, 59, 0.4);
            color: #94a3b8;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s;
        }
        .save-btn:hover:not(:disabled) { 
            background-color: rgba(59, 130, 246, 0.15); 
            color: #ffffff;
            border-color: rgba(59, 130, 246, 0.35);
        }
        .save-btn:disabled { opacity: 0.15; cursor: not-allowed; }
        
        .tooltip {
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #0b1329;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        .group:hover .tooltip { opacity: 1; }
        
        .note-item {
            background: rgba(15, 23, 42, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.15s ease;
        }
        .note-item:hover {
            border-color: rgba(59, 130, 246, 0.3);
            background: rgba(15, 23, 42, 0.6);
        }

        .transcript-bubble {
            animation: bubble-fade 0.3s ease-out forwards;
            border-left: 2px solid rgba(59, 130, 246, 0.4);
            background: rgba(30, 41, 59, 0.12);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            border-right: 1px solid rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        @keyframes bubble-fade {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse-live {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.25);
        }
    </style>
</head>
<body class="text-slate-300 antialiased h-screen flex flex-col p-4">
    
    <!-- Top Compact Header & Status Indicators -->
    <header class="flex items-center justify-between mb-4 px-2 shrink-0">
        <div class="flex items-center gap-3">
            <!-- Academic Logo -->
            <div class="flex items-center gap-2 bg-slate-900/80 border border-slate-800/80 px-3 py-1.5 rounded-xl shadow-sm">
                <svg class="h-4.5 w-4.5 text-blue-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c0 2 2.5 3 6 3s6-1 6-3v-5"/>
                </svg>
                <span class="text-xs font-semibold tracking-wider text-slate-300 uppercase">KNPU AI Campus</span>
            </div>
            <h1 class="text-lg font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                강의록 요약 대시보드
            </h1>
        </div>

        <!-- Badges -->
        <div class="flex gap-2 text-[10px] font-medium">
            <span id="badge-firebase" class="bg-slate-900/80 text-slate-500 border border-slate-800 px-2.5 py-1 rounded-lg flex items-center gap-1.5 shadow-sm">
                <span class="h-1.5 w-1.5 rounded-full bg-slate-600"></span> DB 대기
            </span>
            <span id="badge-engine" class="bg-slate-900/80 text-slate-500 border border-slate-800 px-2.5 py-1 rounded-lg flex items-center gap-1.5 shadow-sm">
                <span class="h-1.5 w-1.5 rounded-full bg-slate-600"></span> 마이크 비활성
            </span>
        </div>
    </header>

    <!-- Main Workspace (Desktop Single Screen Layout) -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 flex-grow min-h-0">
        
        <!-- Left Sidebar (Settings + History) -->
        <div class="lg:col-span-1 flex flex-col gap-3 min-h-0 h-full">
            
            <!-- Credentials Config Card -->
            <div class="premium-card rounded-2xl p-4 flex flex-col shrink-0 shadow-md">
                
                <!-- Gemini Key Row -->
                <div class="mb-3">
                    <div class="flex justify-between items-center mb-1">
                        <label for="apiKey" class="text-[11px] font-semibold text-slate-400 flex items-center gap-1">
                            <i data-lucide="key" class="h-3.5 w-3.5 text-yellow-500"></i> Gemini AI API Key
                        </label>
                        <button type="button" id="toggleApiKey" class="text-[10px] text-slate-500 hover:text-slate-300 transition-colors">보기</button>
                    </div>
                    <input type="password" id="apiKey" class="bg-slate-950 border border-slate-850 text-slate-200 text-xs rounded-lg focus:ring-1 focus:ring-blue-500 focus:border-blue-500 block w-full p-2 font-mono transition-colors" placeholder="API Key 입력">
                </div>

                <!-- Gemini Model Selection Row -->
                <div class="mb-3">
                    <div class="flex justify-between items-center mb-1">
                        <label for="modelSelect" class="text-[11px] font-semibold text-slate-400 flex items-center gap-1">
                            <i data-lucide="cpu" class="h-3.5 w-3.5 text-blue-400"></i> AI 모델 선택 (자동조회)
                        </label>
                        <button type="button" id="refreshModelsBtn" class="text-[10px] text-slate-500 hover:text-slate-300 transition-colors hidden" title="모델 새로고침"><i data-lucide="refresh-cw" class="h-3 w-3"></i></button>
                    </div>
                    <select id="modelSelect" class="bg-slate-950 border border-slate-850 text-slate-200 text-[11px] rounded-lg focus:ring-1 focus:ring-blue-500 focus:border-blue-500 block w-full p-1.5 font-mono transition-colors">
                        <option value="gemini-1.5-flash">API Key를 입력하면 최신 모델을 조회합니다...</option>
                    </select>
                </div>

                <!-- Firebase Accordion Header -->
                <div class="border-t border-slate-800/80 pt-2.5 flex items-center justify-between">
                    <span class="text-[11px] font-semibold text-slate-400 flex items-center gap-1">
                        <i data-lucide="database" class="h-3.5 w-3.5 text-blue-400"></i> Firebase 데이터베이스
                    </span>
                    <button type="button" id="toggleFbInputs" class="text-slate-500 hover:text-slate-300 transition-colors">
                        <i data-lucide="chevron-down" class="h-3.5 w-3.5" id="fbChevron"></i>
                    </button>
                </div>
                
                <!-- Firebase Inputs (Collapsible) -->
                <div id="fbInputsWrapper" class="space-y-2 mt-2 bg-slate-950/50 p-3 rounded-lg border border-slate-900 transition-all duration-300 overflow-hidden" style="max-height: 0px; padding: 0px; border-width: 0px;">
                    <div>
                        <label class="block text-[9px] tracking-wider text-slate-500 mb-0.5 font-semibold">Project ID</label>
                        <input type="text" id="fbProjectId" class="bg-slate-900 border border-slate-800 text-slate-300 text-[11px] rounded-md block w-full p-1.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" placeholder="your-project-id">
                    </div>
                    <div>
                        <label class="block text-[9px] tracking-wider text-slate-500 mb-0.5 font-semibold">API Key</label>
                        <input type="password" id="fbApiKey" class="bg-slate-900 border border-slate-800 text-slate-300 text-[11px] rounded-md block w-full p-1.5 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" placeholder="AIzaSy...">
                    </div>
                    <button id="fbConnectBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-white text-[11px] font-semibold py-1.5 rounded-md border border-slate-700 transition-all flex items-center justify-center gap-1.5">
                        <i data-lucide="link" class="h-3 w-3"></i> 연결 실행
                    </button>
                </div>

                <div id="fbStatus" class="text-center text-[10px] text-slate-500 flex items-center justify-center gap-1 mt-2.5">
                    <span id="fbDot" class="h-1.5 w-1.5 rounded-full bg-slate-600 inline-block"></span>
                    <span id="fbStatusText">데이터베이스 연동 대기</span>
                </div>
            </div>

            <!-- Notes Archive Card (Scrollable) -->
            <div class="premium-card rounded-2xl p-4 flex flex-col flex-grow min-h-0 shadow-md">
                <div class="flex items-center justify-between mb-3 border-b border-slate-800/80 pb-2">
                    <span class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                        <i data-lucide="folder-open" class="h-4 w-4 text-blue-400"></i> 저장된 요약 노트
                    </span>
                    <button id="fbRefreshBtn" class="text-slate-500 hover:text-blue-400 transition-colors">
                        <i data-lucide="refresh-cw" class="h-3.5 w-3.5"></i>
                    </button>
                </div>
                <div id="fbHistoryList" class="flex-grow overflow-y-auto custom-scrollbar space-y-2 text-xs text-slate-500 italic pr-1">
                    데이터베이스를 연결하여 과거 이력을 불러오십시오.
                </div>
            </div>
        </div>

        <!-- Right Side Panel (Workspace) -->
        <div class="lg:col-span-3 flex flex-col gap-4 min-h-0 h-full">
            
            <!-- Top Compact Control Bar -->
            <div class="premium-card p-3 rounded-2xl shadow-md shrink-0">
                <div class="flex flex-col md:flex-row items-center gap-3">
                    
                    <!-- Title Input -->
                    <div class="flex-grow w-full md:w-auto">
                        <input type="text" id="titleInput" class="bg-slate-950/85 border border-slate-850 text-slate-200 text-xs rounded-xl focus:ring-1 focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 transition-all placeholder-slate-600 font-medium" placeholder="강의 및 회의 제목 입력">
                    </div>

                    <!-- Context/Guide Input -->
                    <div class="flex-grow w-full md:w-auto">
                        <input type="text" id="contextInput" class="bg-slate-950/85 border border-slate-850 text-slate-200 text-xs rounded-xl focus:ring-1 focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 transition-all placeholder-slate-600" placeholder="요약 가이드 지침 (예: 주요 정책 대책 위주 요약)">
                    </div>

                    <!-- Compact Record Button -->
                    <button type="button" id="recordBtn" class="bg-red-600/90 hover:bg-red-600 text-white font-semibold px-5 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md h-[38px] min-w-[125px] shrink-0 text-xs">
                        <span id="micIconContainer" class="relative flex items-center justify-center">
                            <i data-lucide="mic" class="h-4 w-4"></i>
                        </span>
                        <span id="recordBtnText">녹음 시작</span>
                    </button>

                    <!-- Audio File Upload Button (Secure context fallback) -->
                    <input type="file" id="audioFileInput" accept="audio/*" class="hidden">
                    <button type="button" id="uploadBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-350 font-semibold px-4 rounded-xl flex items-center justify-center gap-1.5 transition-all shadow-md h-[38px] shrink-0 text-xs border border-slate-700">
                        <i data-lucide="upload" class="h-4 w-4 text-blue-400"></i>
                        <span>오디오 파일 업로드</span>
                    </button>
                    
                    <!-- Dynamic state bar hidden but updated dynamically -->
                    <div id="status" class="hidden"><span id="status-indicator"></span><span id="status-text"></span></div>
                </div>
            </div>

            <!-- Workspace Panels Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-grow min-h-0 h-full">
                
                <!-- Left Column (Live Transcript & Live AI Summary) -->
                <div class="flex flex-col gap-4 min-h-0 h-full">
                    
                    <!-- AI Polished Transcript Panel -->
                    <div class="premium-card rounded-2xl flex flex-col flex-1 min-h-0 shadow-md">
                        <div class="px-4 py-2.5 border-b border-slate-850/60 bg-slate-900/35 flex justify-between items-center shrink-0">
                            <div class="flex items-center gap-3">
                                <h2 class="text-xs font-semibold text-slate-300 flex items-center gap-1.5 mr-1">
                                    <i data-lucide="sparkles" class="h-4 w-4 text-blue-400"></i> AI 교정 속기록
                                </h2>
                            </div>
                            <button type="button" id="saveTranscriptTxtBtn" disabled class="save-btn group">
                                <i data-lucide="download" class="h-3.5 w-3.5"></i>
                                <span class="tooltip">TXT 다운로드</span>
                            </button>
                        </div>
                        <div class="relative flex-grow min-h-0 flex flex-col">
                            <div id="aiTranscriptContainer" class="p-4 overflow-y-auto custom-scrollbar flex-grow text-xs leading-relaxed text-slate-300">
                                <p class="text-slate-650 italic">녹음이 시작되면 300단어마다 AI 정밀 교정본이 이곳에 실시간 출력됩니다.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Real-time AI Summary -->
                    <div class="premium-card rounded-2xl flex flex-col flex-1 min-h-0 shadow-md">
                        <div class="px-4 py-2.5 border-b border-slate-850/60 bg-slate-900/35 flex justify-between items-center shrink-0">
                            <h2 class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                                <i data-lucide="sparkles" class="h-4 w-4 text-yellow-500"></i> 실시간 AI 요약 노트
                            </h2>
                            <div class="flex items-center gap-1.5">
                                <div id="interimSummaryLoader" class="hidden"><i data-lucide="loader-circle" class="h-3.5 w-3.5 animate-spin text-yellow-400"></i></div>
                                <button type="button" id="saveInterimSummaryBtn" disabled class="save-btn group">
                                    <i data-lucide="file-text" class="h-3.5 w-3.5"></i>
                                    <span class="tooltip">MD 다운로드</span>
                                </button>
                            </div>
                        </div>
                        <div id="interimSummary" class="p-4 overflow-y-auto custom-scrollbar flex-grow text-xs leading-relaxed text-slate-300">
                            <p class="text-slate-600 italic">실시간 분석 대기 중...</p>
                        </div>
                    </div>
                </div>

                <!-- Right Column (Final Report) -->
                <div class="premium-card rounded-2xl flex flex-col min-h-0 h-full shadow-md">
                    <div class="px-4 py-2.5 border-b border-slate-850/60 bg-slate-900/35 flex justify-between items-center shrink-0">
                        <h2 class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                            <i data-lucide="book-marked" class="h-4.5 w-4.5 text-blue-400"></i> 최종 정리 보고서
                        </h2>
                        <button type="button" id="saveFinalSummaryDocBtn" disabled class="bg-blue-600/80 hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1 shadow disabled:opacity-15 disabled:cursor-not-allowed">
                            <i data-lucide="download" class="h-3.5 w-3.5"></i> .docx 다운로드
                        </button>
                    </div>
                    <div class="p-5 overflow-y-auto custom-scrollbar flex-grow min-h-0">
                        <div id="finalSummary" class="prose prose-invert prose-xs max-w-none">
                            <div class="text-center py-20 text-slate-600 text-xs">강의가 끝나거나 분석이 완료되면 최종 요약 정리 결과물이 출력됩니다.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="error-message" class="fixed bottom-6 right-6 bg-slate-950/95 backdrop-blur-md text-white py-4 px-5 rounded-xl shadow-lg z-50 flex items-start gap-3 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none border border-slate-800">
        <i data-lucide="alert-circle" class="h-5 w-5 text-red-500"></i>
        <span id="error-text" class="text-sm font-medium"></span>
    </div>

    <script>
        lucide.createIcons();

        // ────────────────────────────────────────────────────────────────
        // [FIREBASE DEFAULT CONFIGURATION]
        // 아래 객체에 Firebase Project ID와 API Key를 미리 적어 두면,
        // 사용자가 화면에서 정보를 입력할 필요 없이 데이터베이스가 즉시 자동 연결됩니다.
        // ────────────────────────────────────────────────────────────────
        const DEFAULT_FIREBASE_CONFIG = {
            projectId: "", // 여기에 Firebase Project ID 기입 가능
            apiKey: ""     // 여기에 Firebase API Key 기입 가능
        };

        // Left sidebar accordion toggle
        const toggleFbInputsBtn = document.getElementById('toggleFbInputs');
        const fbInputsWrapper = document.getElementById('fbInputsWrapper');
        const fbChevron = document.getElementById('fbChevron');
        let fbCollapsed = true; // default collapsed in SaaS sidebar

        toggleFbInputsBtn.addEventListener('click', () => {
            fbCollapsed = !fbCollapsed;
            if (fbCollapsed) {
                fbInputsWrapper.style.maxHeight = '0px';
                fbInputsWrapper.style.padding = '0px';
                fbInputsWrapper.style.borderWidth = '0px';
                fbChevron.setAttribute('data-lucide', 'chevron-down');
            } else {
                fbInputsWrapper.style.maxHeight = '500px';
                fbInputsWrapper.style.padding = '0.75rem';
                fbInputsWrapper.style.borderWidth = '1px';
                fbChevron.setAttribute('data-lucide', 'chevron-up');
            }
            lucide.createIcons();
        });

        // ── Firebase status updates ─────────────────────────────────────────
        function updateFbStatus(connected, msg) {
            const fbDot = document.getElementById('fbDot');
            const fbBadge = document.getElementById('badge-firebase');
            
            fbDot.className = 'h-1.5 w-1.5 rounded-full inline-block ' + (connected ? 'bg-emerald-500' : 'bg-slate-600');
            document.getElementById('fbStatusText').textContent = msg;

            if (connected) {
                fbBadge.className = 'bg-emerald-950/80 text-emerald-400 border border-emerald-800/40 px-2.5 py-1 rounded-lg flex items-center gap-1.5 shadow-sm';
                fbBadge.innerHTML = '<span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span> DB 연결됨';
            } else {
                fbBadge.className = 'bg-slate-900/80 text-slate-500 border border-slate-800 px-2.5 py-1 rounded-lg flex items-center gap-1.5 shadow-sm';
                fbBadge.innerHTML = '<span class="h-1.5 w-1.5 rounded-full bg-slate-600"></span> DB 대기';
            }
            lucide.createIcons();
        }

        async function loadHistory() {
            if (!fbDb) return;
            const list = document.getElementById('fbHistoryList');
            list.innerHTML = '<span class="text-slate-500 text-[10px]">노트를 동기화하는 중...</span>';
            try {
                const snap = await fbDb.collection('lectures')
                    .orderBy('createdAt', 'desc').limit(20).get();
                if (snap.empty) {
                    list.innerHTML = '<span class="text-slate-650 italic">저장된 강의 요약본이 존재하지 않습니다.</span>';
                    return;
                }
                list.innerHTML = '';
                snap.forEach(doc => {
                    const d = doc.data();
                    const item = document.createElement('div');
                    item.className = 'note-item rounded-xl p-2.5 cursor-pointer';
                    const dt = d.createdAt?.toDate?.() ?? new Date();
                    item.innerHTML = `
                        <div class="font-bold text-slate-300 truncate flex items-center gap-1.5">
                            <i data-lucide="file-text" class="h-3.5 w-3.5 text-slate-400"></i>
                            ${d.title || '(제목 미정)'}
                        </div>
                        <div class="text-slate-500 text-[9px] mt-1.5 flex items-center justify-between">
                            <span>${dt.toLocaleString('ko-KR')}</span>
                            <span class="text-blue-400 font-semibold">보관 완료</span>
                        </div>`;
                    item.addEventListener('click', () => loadNoteIntoView(doc.id, d));
                    list.appendChild(item);
                });
                lucide.createIcons();
            } catch (e) {
                list.innerHTML = '<span class="text-red-400">동기화 실패: ' + e.message + '</span>';
            }
        }

        function loadNoteIntoView(id, data) {
            currentDocId = id;
            finalSummaryRawMarkdown = data.finalSummary || '';
            fullTranscript = data.transcript || '';
            aiTranscript = data.aiTranscript || data.transcript || ''; // AI교정본이 있으면 우선 로드, 없으면 원본으로 대체
            titleInput.value = data.title || '';

            if (fullTranscript) {

        async function callGeminiAPI(systemPrompt, userText) {
            const currentKey = apiKeyInput.value.trim();
            if (!currentKey) {
                showError('Gemini API Key를 입력해주십시오.');
                return null;
            }

            const model = document.getElementById('modelSelect').value || 'gemini-1.5-flash';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${currentKey}`;
            const payload = {
                systemInstruction: { parts: [{ text: systemPrompt }] },
                contents: [{ parts: [{ text: userText }] }]
            };

            const delays = [1000, 2000, 4000, 8000, 16000];
            let lastErrorMsg = '';

            for (let i = 0; i <= delays.length; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        let errMsg = `HTTP ${response.status}`;
                        try {
                            const errData = await response.json();
                            errMsg = errData.error?.message || errMsg;
                        } catch (e) {}
                        throw new Error(`[${response.status}] ${errMsg}`);
                    }

                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || null;
                } catch (error) {
                    lastErrorMsg = error.message;
                    if (lastErrorMsg.includes('[400]') || lastErrorMsg.includes('[403]') || lastErrorMsg.includes('[404]')) break;
                    if (i === delays.length) break;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }

            console.error('AI 분석망 통신 오류:', lastErrorMsg);
            showError('AI 분석망 통신 오류: ' + lastErrorMsg);
            return null;
        }

        async function triggerChunkPolishing(isFinal = false) {
            const currentKey = apiKeyInput.value.trim();
            if (!currentKey || isPolishingChunk || !isRecording) return;

            const startIdx = lastPolishedLength;
            const endIdx = fullTranscript.length;
            const chunk = fullTranscript.substring(startIdx, endIdx).trim();
            
            const words = chunk ? chunk.split(/\s+/) : [];
            const minWords = isFinal ? 5 : 300;
            if (words.length < minWords) return;

            isPolishingChunk = true;
            document.getElementById('interimSummaryLoader').classList.remove('hidden');

            const model = document.getElementById('modelSelect').value || 'gemini-1.5-flash';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${currentKey}`;

            const prompt = `당신은 실시간 속기 및 요약 전문가입니다. 제공된 한국어 음성 인식 텍스트(거친 텍스트)를 맞춤법 교정하고, 동시에 해당 청크의 핵심을 불렛마크로 요약해 주십시오.
반드시 아래 JSON 포맷을 그대로 준수하여 단 한 단어의 다른 부연설명도 없이 JSON 결과만 출력하십시오:
{
  "polishedText": "맞춤법, 띄어쓰기, 문장부호가 무손실로 완벽히 교정된 한국어 텍스트. 절대 요약하지 말고 원문의 모든 세부 정보를 온전히 보존하십시오.",
  "bulletSummary": "이 청크에 대한 요약 불렛마크들 (마크다운 포맷. 예: - **핵심 주제**\\n  - 세부 내용)"
}`;

            const payload = {
                contents: [{
                    parts: [
                        { text: prompt },
                        { text: `[거친 텍스트]\n${chunk}` }
                    ]
                }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            polishedText: { type: "STRING" },
                            bulletSummary: { type: "STRING" }
                        },
                        required: ["polishedText", "bulletSummary"]
                    }
                }
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    const rawJson = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (rawJson) {
                        const parsed = JSON.parse(rawJson.trim());
                        const polishedText = parsed.polishedText || '';
                        const bulletSummary = parsed.bulletSummary || '';

                        if (polishedText) {
                            // Append to aiTranscript
                            if (aiTranscript.length > 0) {
                                aiTranscript += ' ' + polishedText;
                            } else {
                                aiTranscript = polishedText;
                            }

                            // Update UI
                            aiTranscriptContainer.innerHTML = '';
                            const p = document.createElement('p');
                            p.className = 'text-slate-300 leading-relaxed whitespace-pre-wrap';
                            p.textContent = aiTranscript;
                            aiTranscriptContainer.appendChild(p);
                            aiTranscriptContainer.scrollTop = aiTranscriptContainer.scrollHeight;
                            document.getElementById('saveTranscriptTxtBtn').disabled = false;
                        }

                        if (bulletSummary) {
                            // Update live summary
                            summaryHistory.push(bulletSummary);
                            const block = document.createElement('div');
                            block.className = 'p-3 bg-slate-900/60 rounded-xl border border-slate-800/60 mb-3 prose prose-invert prose-xs max-w-none';
                            block.innerHTML = marked.parse(bulletSummary);

                            if (interimSummaryDiv.querySelector('p.italic')) {
                                interimSummaryDiv.innerHTML = '';
                            }
                            interimSummaryDiv.appendChild(block);
                            interimSummaryDiv.scrollTop = interimSummaryDiv.scrollHeight;
                            document.getElementById('saveInterimSummaryBtn').disabled = false;
                        }

                        // Advance the polished pointer
                        lastPolishedLength = endIdx;
                    }
                }
            } catch (err) {
                console.error('실시간 청크 교정 및 요약 실패:', err);
            } finally {
                isPolishingChunk = false;
                document.getElementById('interimSummaryLoader').classList.add('hidden');
                lucide.createIcons();
                
                // If more text has accumulated while calling the API, trigger again
                const remainingChunk = fullTranscript.substring(lastPolishedLength).trim();
                const remainingWords = remainingChunk ? remainingChunk.split(/\s+/).length : 0;
                if (remainingWords >= 300 && isRecording) {
                    setTimeout(() => triggerChunkPolishing(false), 1000);
                }
            }
        }

## 1. 개요 및 취지
- **기록 목적 및 배경:**
- **주요 핵심 주제:**

[Input]

        }

        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (window.SpeechRecognition) {
            recognition = new window.SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true; 
            recognition.lang = 'ko-KR';
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isRecognizing = true;
                updateStatus('오디오 기록 중', 'recording');
            };

             recognition.onresult = (event) => {
                networkErrorCount = 0; // Reset network error count on successful recognition
                let finalChunk = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalChunk += event.results[i][0].transcript + ' ';
                    }
                }
                
                if (finalChunk) {
                    fullTranscript += finalChunk;
                    
                    // Trigger chunk-based real-time AI polishing every 300 words
                    const pendingChunk = fullTranscript.substring(lastPolishedLength).trim();
                    const pendingWords = pendingChunk ? pendingChunk.split(/\s+/).length : 0;
                    if (pendingWords >= 300 && !isPolishingChunk) {
                        triggerChunkPolishing(false);
                    }
                }
                
                requestAnimationFrame(() => {
                    aiTranscriptContainer.scrollTop = aiTranscriptContainer.scrollHeight;
                });
            };

            recognition.onerror = (e) => {
                console.warn('Speech Recognition Error:', e.error);
                
                if (e.error === 'not-allowed') {
                    showError('마이크 권한이 거부되었습니다. 마이크 입력을 허용해 주십시오.');
                    stopRecordingAndAnalyze();
                } else if (e.error === 'network') {
                    hadNetworkError = true;
                    networkErrorCount++;
                    console.log(`음성 인식 네트워크 끊김 (${networkErrorCount}회) → 빠른 복구 시도`);
                    if (networkErrorCount === 4) {

                    stopRecordingAndAnalyze();
                }
            };

            recognition.onend = () => {
                isRecognizing = false;
                
                if (isRecording) {

                systemInstruction: { parts: [{ text: systemPrompt }] },
                contents: [{
                    parts: [
                        {
                            inlineData: {
                                mimeType: file.type || 'audio/webm',
                                data: base64Audio
                            }
                        },
                        {
                            text: `[요약 지침 지시사항]
- 강의/회의 제목: ${titleInput.value || '미정'}
- 추가 요약 가이드 지침: ${contextInput.value || '없음'}

위 오디오 녹음 데이터를 듣고, 텍스트 받아쓰기(transcript)와 최종 학술 요약 보고서(summary)를 위 정의한 JSON 규격에 정확히 맞추어 생성해 주십시오.`
                        }
                    ]
                }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            transcript: { type: "STRING", description: "The full, punctuated, and corrected transcript of the audio in Korean." },
                            summary: { type: "STRING", description: "The final formatted markdown summary report." }
                        },
                        required: ["transcript", "summary"]
                    }
                }
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    let errMsg = `HTTP ${response.status}`;
                    try {
                        const errData = await response.json();
                        errMsg = errData.error?.message || errMsg;
                    } catch (e) {}
                    throw new Error(`[${response.status}] ${errMsg}`);
                }

                const data = await response.json();
                const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!rawText) throw new Error('API 응답에 데이터가 없습니다.');

                let cleanedText = rawText.trim();
                if (cleanedText.startsWith('```')) {
                    cleanedText = cleanedText.replace(/^```(?:json)?\n?/, '').replace(/\n?```$/, '');
                }
                const parsed = JSON.parse(cleanedText);
                if (parsed.transcript && parsed.summary) {
                    // Update UI (Both raw and AI tab share the uploaded transcript)
                    fullTranscript = parsed.transcript;
                    aiTranscript = parsed.transcript;
                    
                    const p1 = document.createElement('p');
                    p1.id = 'liveParagraph';
                    p1.className = 'mb-4 leading-relaxed whitespace-pre-wrap';
                    p1.textContent = fullTranscript;
                    transcriptDiv.innerHTML = '';
                    transcriptDiv.appendChild(p1);

                    const p2 = document.createElement('p');
                    p2.className = 'mb-4 leading-relaxed whitespace-pre-wrap';
                    p2.textContent = aiTranscript;
                    aiTranscriptContainer.innerHTML = '';
                    aiTranscriptContainer.appendChild(p2);
                    
                    // Default to raw tab view
                    tabRawTranscript.click();

                    // Update summaries
                    finalSummaryRawMarkdown = parsed.summary;
                    finalSummaryDiv.innerHTML = marked.parse(parsed.summary);
                    interimSummaryDiv.innerHTML = marked.parse(parsed.summary);

                    // Enable download buttons
                    document.getElementById('saveFinalSummaryDocBtn').disabled = false;
                    document.getElementById('saveTranscriptTxtBtn').disabled = false;
                    document.getElementById('saveInterimSummaryBtn').disabled = false;

                    // Save to Firebase if active
                    if (fbDb) {
                        saveToFirebase(!!currentDocId);
                    }

                    updateStatus('분석 완료', 'idle');
                    showToast('오디오 파일 고정밀 분석 및 요약을 성공적으로 마쳤습니다.', 'success');
                } else {
                    throw new Error('응답의 JSON 필드가 누락되었습니다.');
                }
            } catch (err) {
                console.error(err);
                showError('오디오 분석 실패: ' + err.message);
                updateStatus('분석 실패', 'idle');
            } finally {
                document.getElementById('interimSummaryLoader').classList.add('hidden');
                lucide.createIcons();
            }
        }

        recordBtn.addEventListener('click', async (e) => {
            e.preventDefault();

            if (!recognition) {
                showError('현재 브라우저는 음성 인식을 지원하지 않습니다. Chrome 환경을 이용해주세요.');
                return;
            }

            if (isProcessing) {
                showError('이전 기록을 분석 요약하는 중입니다. 완료 후 다시 시도하십시오.');
                return;
            }

            if (!isRecording) {
                const currentKey = apiKeyInput.value.trim();
                if (!currentKey) {
                    showError('Gemini API Key를 입력해주십시오.');
                    apiKeyInput.focus();
                    return;
                }

                isRecording = true;
                hadNetworkError = false;
                lastNetworkErrorTime = 0;
                networkErrorCount = 0;
                lastPolishedLength = 0;
                isPolishingChunk = false;
                fullTranscript = '';
                aiTranscript = '';
                summaryHistory = [];
                lastProcessedLength = 0;
                finalSummaryRawMarkdown = '';
                document.getElementById('saveTranscriptTxtBtn').disabled = true;
                document.getElementById('saveInterimSummaryBtn').disabled = true;
                document.getElementById('saveFinalSummaryDocBtn').disabled = true;
                aiTranscriptContainer.innerHTML = '<p class="text-slate-500 italic">녹음 중... 300단어가 수집되면 AI 교정 속기록이 실시간으로 출력됩니다.</p>';
                
                interimSummaryDiv.innerHTML = '<p class="text-slate-500 italic">실시간 문맥 분석 대기 중...</p>';
                finalSummaryDiv.innerHTML = '<div class="text-center py-20 text-slate-500 text-xs">강의를 녹음하는 중입니다...</div>';

                try {
                    // Initialize MediaRecorder for background audio recording
                    audioChunks = [];
                    try {
                        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        let options = { mimeType: 'audio/webm' };
                        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                            options = { mimeType: 'audio/ogg' };
                        }
                        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                            options = { mimeType: '' }; 
                        }
                        mediaRecorder = new MediaRecorder(audioStream, options);
                        mediaRecorder.ondataavailable = (event) => {
                            if (event.data.size > 0) {
                                audioChunks.push(event.data);
                            }
                        };
                        mediaRecorder.start();
                    } catch (mErr) {
                        console.warn('MediaRecorder 초기화 실패 (실시간 음성인식만 작동):', mErr);
                        mediaRecorder = null;
                    }

                    // Start SpeechRecognition immediately to avoid dropping first words!
                    if (!isRecognizing) recognition.start();
                    updateStatus('오디오 기록 중', 'recording');
                    
                    // Live Recording Style
                    recordBtn.classList.remove('bg-red-600/90', 'hover:bg-red-600');
                    recordBtn.classList.add('bg-slate-800', 'hover:bg-slate-700', 'border', 'border-red-500/40', 'pulse-live');
                    
                    micIconContainer.innerHTML = '<span class="relative flex h-2.5 w-2.5 mr-0.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span></span>';
                    document.getElementById('recordBtnText').textContent = '녹음 중지';
                    
                    lucide.createIcons();
                } catch (err) {
                    showError('음성 입력 개시 실패: ' + err.message);
                    isRecording = false;
                    if (audioStream) {
                        try {
                            audioStream.getTracks().forEach(track => track.stop());
                        } catch (stErr) {}
                    }
                }
            } else {
                stopRecordingAndAnalyze();
            }
        });

        document.getElementById('toggleApiKey').addEventListener('click', (e) => {
            e.preventDefault();
            const isPassword = apiKeyInput.type === 'password';
            apiKeyInput.type = isPassword ? 'text' : 'password';
            document.getElementById('toggleApiKey').textContent = isPassword ? '숨기기' : '보기';
        });

        document.getElementById('saveTranscriptTxtBtn').addEventListener('click', (e) => {
            e.preventDefault();
            const contentToSave = aiTranscript || fullTranscript;
            if (!contentToSave) return;
            const blob = new Blob([contentToSave], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${titleInput.value || '강의록'}_속기록.txt`;
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('saveFinalSummaryDocBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            if (!finalSummaryRawMarkdown) return;

            try {
                const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType, Table, TableRow, TableCell, WidthType, BorderStyle } = docx;

                const lines = finalSummaryRawMarkdown.split('\n');
                const children = [];

                for (const line of lines) {
                    const trimmed = line.trimEnd();

                    if (trimmed.startsWith('# ')) {
                        children.push(new Paragraph({
                            text: trimmed.slice(2),
                            heading: HeadingLevel.HEADING_1,
                            spacing: { after: 200 }
                        }));
                    } else if (trimmed.startsWith('## ')) {
                        children.push(new Paragraph({
                            text: trimmed.slice(3),
                            heading: HeadingLevel.HEADING_2,
                            spacing: { before: 240, after: 120 }
                        }));
                    } else if (trimmed.startsWith('### ')) {
                        children.push(new Paragraph({
                            text: trimmed.slice(4),
                            heading: HeadingLevel.HEADING_3,
                            spacing: { before: 160, after: 80 }
                        }));
                    } else if (trimmed.startsWith('> ')) {
                        children.push(new Paragraph({
                            children: [new TextRun({ text: trimmed.slice(2), italics: true, color: '444444' })],
                            indent: { left: 720 },
                            spacing: { after: 120 },
                            border: { left: { style: BorderStyle.SINGLE, size: 6, color: '1E3A8A' } }
                        }));
                    } else if (/^(\s*)-\s+\*\*(.+?)\*\*(.*)$/.test(trimmed)) {
                        const m = trimmed.match(/^(\s*)-\s+\*\*(.+?)\*\*(.*)$/);
                        const indent = m[1].length > 0 ? 1440 : 720;
                        children.push(new Paragraph({
                            children: [
                                new TextRun({ text: m[2], bold: true }),
                                new TextRun({ text: m[3] || '' })
                            ],
                            bullet: { level: m[1].length > 0 ? 1 : 0 },
                            spacing: { after: 60 }
                        }));
                    } else if (/^(\s*)-\s+(.+)$/.test(trimmed)) {
                        const m = trimmed.match(/^(\s*)-\s+(.+)$/);
                        const isSubBullet = m[1].length > 0;
                        let runText = m[2].replace(/\*\*(.+?)\*\*/g, '$1');
                        children.push(new Paragraph({
                            children: [new TextRun({ text: runText, bold: false })],
                            bullet: { level: isSubBullet ? 1 : 0 },
                            spacing: { after: 60 }
                        }));
                    } else if (trimmed === '---') {
                        children.push(new Paragraph({
                            children: [],
                            border: { bottom: { style: BorderStyle.SINGLE, size: 2, color: 'DDDDDD' } },
                            spacing: { before: 120, after: 120 }
                        }));
                    } else if (trimmed === '') {
                        children.push(new Paragraph({ text: '', spacing: { after: 60 } }));
                    } else {
                        const boldParts = trimmed.split(/\*\*(.+?)\*\*/g);
                        const runs = boldParts.map((part, idx) =>
                            new TextRun({ text: part, bold: idx % 2 === 1 })
                        );
                        children.push(new Paragraph({ children: runs, spacing: { after: 80 } }));
                    }
                }

                const docTitle = titleInput.value || '강의록_요약';
                const now = new Date().toLocaleString('ko-KR');

                const document = new Document({
                    styles: {
                        default: {
                            document: {
                                run: { font: 'Malgun Gothic', size: 22 }
                            }
                        }
                    },
                    sections: [{
                        properties: {
                            page: {
                                margin: { top: 1440, right: 1080, bottom: 1440, left: 1080 }
                            }
                        },
                        children: [
                            new Paragraph({
                                children: [new TextRun({ text: '생성 시각: ' + now, size: 18, color: '666666' })],
                                alignment: AlignmentType.RIGHT,
                                spacing: { after: 240 }
                            }),
                            ...children
                        ]
                    }]
                });

                const blob = await Packer.toBlob(document);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${docTitle}.docx`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error(err);
                showError('.docx 파일 문서 생성 실패: ' + err.message);
            }
        });

        document.getElementById('saveInterimSummaryBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (summaryHistory.length === 0) return;
            const mdHeader = `# ${titleInput.value || '실시간 강의 요약'}\n> 본 문서는 AI가 실시간으로 수집 및 중간 요약한 강의록입니다.\n\n---\n\n`;
            const mdContent = mdHeader + summaryHistory.join('\n\n---\n\n');
            const blob = new Blob([mdContent], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${titleInput.value || '실시간강의요약'}.md`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // ── 자동 정보 로딩 및 연동 ─────────────────────────────────────────
        window.addEventListener('load', () => {
            const savedGeminiKey = localStorage.getItem('gemini_api_key');
            if (savedGeminiKey) {
                apiKeyInput.value = savedGeminiKey;
            }

            // Audio File Upload Trigger listeners
            const uploadBtn = document.getElementById('uploadBtn');
            const audioFileInput = document.getElementById('audioFileInput');

            uploadBtn.addEventListener('click', () => {
                audioFileInput.click();
            });

            audioFileInput.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (file) {
                    await processUploadedAudioFile(file);
                }
            });

            // Check protocol for Web Speech API compatibility warning
            if (window.location.protocol === 'file:') {
                transcriptDiv.innerHTML = `
                    <div class="bg-red-950/30 border border-red-800/40 rounded-xl p-3.5 text-xs text-red-300 leading-normal flex flex-col gap-2 shadow-inner">
                        <div class="font-bold flex items-center gap-1.5 text-red-400">
                            <i data-lucide="alert-triangle" class="h-4 w-4"></i> 브라우저 보안 정책 제한 안내
                        </div>
                        <p>크롬(Chrome) 브라우저의 보안 규정상, HTML 파일을 직접 더블 클릭하여 실행한 로컬 경로(<code>file://</code>)에서는 마이크 권한 획득이 불가능하여 <strong>실시간 속기 기능이 작동하지 않습니다.</strong></p>
                        <div class="border-t border-red-800/20 my-1"></div>
                        <p class="font-semibold text-slate-350">💡 해결 방법:</p>
                        <ul class="list-disc list-inside space-y-1 text-slate-400">
                            <li>옆의 <strong>[오디오 파일 업로드]</strong> 버튼을 사용하여 녹음된 음성 파일을 Gemini AI로 즉시 요약 분석할 수 있습니다 (추천).</li>
                            <li>또는 VS Code의 Live Server나 아래 명령어로 로컬 서버(<code>localhost</code>) 환경에서 실행하십시오.</li>
                        </ul>
                        <div class="bg-slate-950 p-2 rounded-lg text-[10px] font-mono select-all text-slate-400 border border-slate-900 mt-1">
                            npx http-server -p 8080
                        </div>
                    </div>
                `;
                lucide.createIcons();
            }

            // 1순위: DEFAULT_FIREBASE_CONFIG
            // 2순위: localStorage 백업값
            const firebaseProjectId = DEFAULT_FIREBASE_CONFIG.projectId.trim() || localStorage.getItem('fb_project_id');
            const firebaseApiKey = DEFAULT_FIREBASE_CONFIG.apiKey.trim() || localStorage.getItem('fb_api_key');

            if (firebaseProjectId && firebaseApiKey) {
                document.getElementById('fbProjectId').value = firebaseProjectId;
                document.getElementById('fbApiKey').value = firebaseApiKey;
                
                // Silent auto-connect
                connectFirebase(firebaseProjectId, firebaseApiKey, true);
                
                // In SaaS layout, keep collapsed by default
                fbCollapsed = true;
                fbInputsWrapper.style.maxHeight = '0px';
                fbInputsWrapper.style.padding = '0px';
                fbInputsWrapper.style.borderWidth = '0px';
                fbChevron.setAttribute('data-lucide', 'chevron-down');
                lucide.createIcons();
            }

            // Auto save Gemini key and fetch models with debounce
            let fetchTimeout = null;
            apiKeyInput.addEventListener('input', () => {
                const key = apiKeyInput.value.trim();
                localStorage.setItem('gemini_api_key', key);
                
                clearTimeout(fetchTimeout);
                fetchTimeout = setTimeout(() => {
                    fetchAvailableModels();
                }, 800);
            });

            // Dynamic Model Fetching Logic
            const modelSelect = document.getElementById('modelSelect');
            const refreshModelsBtn = document.getElementById('refreshModelsBtn');

            async function fetchAvailableModels() {
                const key = apiKeyInput.value.trim();
                if (!key) return;

                modelSelect.innerHTML = '<option value="">API 통신망 조회 중...</option>';
                refreshModelsBtn.classList.remove('hidden');
                
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                    if (!res.ok) throw new Error('API Key 무효 또는 통신 실패');
                    const data = await res.json();
                    
                    const validModels = data.models.filter(m => 
                        m.name.includes('gemini') && 
                        m.supportedGenerationMethods.includes('generateContent')
                    );

                    if (validModels.length === 0) throw new Error('사용 가능한 모델이 없습니다.');

                    modelSelect.innerHTML = '';
                    
                    // 정렬: 최신 모델이 위로 오도록 (version 기준 내림차순, 같은 버전이면 flash를 위로)
                    validModels.sort((a, b) => {
                        if (a.version !== b.version) return b.version.localeCompare(a.version);
                        if (a.name.includes('flash') && !b.name.includes('flash')) return -1;
                        if (!a.name.includes('flash') && b.name.includes('flash')) return 1;
                        return 0;
                    });

                    let bestDefault = null;
                    const savedModel = localStorage.getItem('gemini_api_model');

                    validModels.forEach(m => {
                        const option = document.createElement('option');
                        const modelId = m.name.replace('models/', '');
                        option.value = modelId;
                        option.textContent = `${m.displayName} (${modelId})`;
                        modelSelect.appendChild(option);

                        // 우선순위 결정: 이전에 선택한 모델 > 가장 최신 flash 모델
                        if (savedModel && savedModel === modelId) {
                            bestDefault = modelId;
                        } else if (!bestDefault && modelId.includes('flash')) {
                            bestDefault = modelId;
                        }
                    });

                    if (bestDefault) {
                        modelSelect.value = bestDefault;
                    } else if (validModels.length > 0) {
                        modelSelect.value = validModels[0].name.replace('models/', '');
                    }
                } catch (err) {
                    console.warn(err);
                    modelSelect.innerHTML = '<option value="gemini-1.5-flash">조회 실패 (기본값 사용: gemini-1.5-flash)</option>';
                } finally {
                    lucide.createIcons();
                }
            }

            apiKeyInput.addEventListener('blur', fetchAvailableModels);
            refreshModelsBtn.addEventListener('click', fetchAvailableModels);
            modelSelect.addEventListener('change', () => {
                localStorage.setItem('gemini_api_model', modelSelect.value);
            });
            
            // Initial fetch if key exists
            if (apiKeyInput.value) {
                fetchAvailableModels();
            }
        });
    </script>
</body>
