<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 강의록 요약 (V4.3.1 - 누락 방지 패치)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(ellipse 80% 80% at 50% -20%, rgba(120, 119, 198, 0.3), rgba(255, 255, 255, 0));
        }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .pulse-live { animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            50% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
        select option { background-color: #1e293b; color: #e2e8f0; }
    </style>
</head>
<body class="text-slate-200 antialiased">
    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        
        <header class="text-center mb-10">
            <h1 class="text-5xl font-bold bg-gradient-to-br from-white to-slate-400 bg-clip-text text-transparent tracking-tight">AI 강의록 요약 <span class="text-lg font-medium text-emerald-400 align-top ml-2 border border-emerald-500/30 bg-emerald-500/10 px-2 py-1 rounded-md">V4.3.1 Fixed</span></h1>
            <p class="text-lg text-slate-400 mt-3 max-w-2xl mx-auto">실시간 요약 누락 버그가 수정된 안정화 버전입니다.</p>
        </header>

        <div class="grid grid-cols-1 gap-6 max-w-5xl mx-auto mb-10">
            <div class="grid md:grid-cols-3 gap-6">
                <div class="md:col-span-2 glass-panel p-4 rounded-xl">
                    <label for="apiKey" class="block text-sm font-medium text-slate-400 mb-2 flex justify-between">
                        <span>Google AI Studio Gemini API 키 (콤마 구분 입력)</span>
                        <span id="keyStatus" class="text-xs text-indigo-400 hidden">현재 1번째 키 사용 중</span>
                    </label>
                    <div class="relative">
                        <input type="password" id="apiKey" class="bg-slate-800/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5 pr-10" placeholder="API 키 입력 (예: key1, key2...)">
                        <button id="toggleApiKey" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-white transition-colors">
                            <span id="eyeIconWrapper"><i data-lucide="eye" class="h-5 w-5"></i></span>
                        </button>
                    </div>
                    <p class="text-xs text-slate-500 mt-2">여러 키 입력 시 429 오류 발생하면 자동 전환됩니다.</p>
                </div>
                <div class="glass-panel p-4 rounded-xl">
                    <label for="modelSelect" class="block text-sm font-medium text-slate-400 mb-2">AI 모델 선택</label>
                    <div class="relative">
                        <select id="modelSelect" class="bg-slate-800/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5 appearance-none cursor-pointer">
                            <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash (Default)</option>
                            <option value="gemini-2.5-pro">Gemini 2.5 Pro (Recommended)</option>
                            <option value="gemini-3-pro">Gemini 3.0 Pro (Latest)</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro (Stable)</option>
                            <option value="gemini-1.5-flash">Gemini 1.5 Flash (Fastest)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400">
                            <i data-lucide="chevron-down" class="h-4 w-4"></i>
                        </div>
                    </div>
                    <p class="text-xs text-slate-500 mt-2" id="modelDesc">속도와 성능이 균형 잡힌 최신 Flash 모델입니다.</p>
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                 <div class="glass-panel p-4 rounded-xl">
                    <label for="titleInput" class="block text-sm font-medium text-slate-400 mb-2">제목</label>
                    <input type="text" id="titleInput" class="bg-slate-800/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5" placeholder="예: 2024년 1분기 마케팅 회의">
                </div>
                <div class="glass-panel p-4 rounded-xl">
                    <label for="contextInput" class="block text-sm font-medium text-slate-400 mb-2">맥락 정보</label>
                    <textarea id="contextInput" rows="1" class="bg-slate-800/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5 custom-scrollbar" placeholder="예: 신규 프로젝트 '오로라' 관련 기획 회의"></textarea>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-center justify-center mb-10">
            <button id="recordBtn" class="bg-gradient-to-br from-indigo-500 to-purple-600 text-white font-bold h-20 w-20 rounded-full shadow-lg hover:from-indigo-600 hover:to-purple-700 focus:outline-none focus:ring-4 focus:ring-indigo-500/50 transition-all duration-300 ease-in-out transform hover:scale-110 flex items-center justify-center">
                <span id="micIconContainer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
                </span>
            </button>
            <div id="status" class="mt-4 text-slate-400 flex items-center space-x-2">
                <div id="status-indicator" class="h-2.5 w-2.5 rounded-full bg-slate-500 transition-colors"></div>
                <span id="status-text" class="font-medium">대기 중</span>
            </div>
        </div>

        <main class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="glass-panel rounded-2xl flex flex-col">
                <div class="flex justify-between items-center p-4 border-b border-slate-700/50">
                    <h2 class="text-xl font-semibold text-white flex items-center gap-2.5">
                        <i data-lucide="file-text" class="h-5 w-5 text-indigo-400"></i>실시간 녹취록
                    </h2>
                    <div class="flex items-center gap-2">
                        <i id="transcriptLoader" data-lucide="loader-circle" class="h-5 w-5 animate-spin text-slate-400 hidden"></i>
                        <button id="saveTranscriptTxtBtn" disabled class="save-btn group">
                            <i data-lucide="file-text" class="h-4 w-4"></i>
                            <span class="tooltip">TXT 저장</span>
                        </button>
                        <button id="saveTranscriptDocBtn" disabled class="save-btn group">
                            <i data-lucide="file-word" class="h-4 w-4"></i>
                             <span class="tooltip">Word 저장</span>
                        </button>
                    </div>
                </div>
                <div id="transcript" class="p-6 h-96 overflow-y-auto custom-scrollbar text-slate-300 leading-relaxed flex-grow">
                    <p class="text-slate-500">녹음을 시작하면 여기에 텍스트가 표시됩니다.</p>
                </div>
            </div>

            <div class="glass-panel rounded-2xl flex flex-col">
                <div class="flex justify-between items-center p-4 border-b border-slate-700/50">
                    <h2 class="text-xl font-semibold text-white flex items-center gap-2.5">
                        <i data-lucide="sparkles" class="h-5 w-5 text-amber-400"></i>실시간 요약
                    </h2>
                     <div class="flex items-center gap-2">
                        <i id="interimSummaryLoader" data-lucide="loader-circle" class="h-5 w-5 animate-spin text-slate-400 hidden"></i>
                        <button id="saveInterimSummaryTxtBtn" disabled class="save-btn group">
                            <i data-lucide="file-text" class="h-4 w-4"></i>
                            <span class="tooltip">TXT 저장</span>
                        </button>
                        <button id="saveInterimSummaryDocBtn" disabled class="save-btn group">
                            <i data-lucide="file-word" class="h-4 w-4"></i>
                            <span class="tooltip">Word 저장</span>
                        </button>
                    </div>
                </div>
                <div id="interimSummary" class="p-6 h-96 overflow-y-auto custom-scrollbar text-slate-300 leading-relaxed space-y-4 flex-grow">
                    <p class="text-slate-500">대화 내용이 감지되면 실시간으로 요약됩니다.</p>
                </div>
            </div>
            
            <div class="lg:col-span-2 glass-panel rounded-2xl flex flex-col">
                <div class="flex justify-between items-center p-4 border-b border-slate-700/50">
                    <h2 class="text-xl font-semibold text-white flex items-center gap-2.5">
                        <i data-lucide="book-open" class="h-5 w-5 text-rose-400"></i>최종 강의 노트
                    </h2>
                    <div class="flex items-center gap-2">
                         <i id="finalSummaryLoader" data-lucide="loader-circle" class="h-5 w-5 animate-spin text-slate-400 hidden"></i>
                        <button id="saveFinalSummaryTxtBtn" disabled class="save-btn group">
                            <i data-lucide="file-text" class="h-4 w-4"></i>
                            <span class="tooltip">TXT 저장</span>
                        </button>
                        <button id="saveFinalSummaryDocBtn" disabled class="save-btn group">
                            <i data-lucide="file-word" class="h-4 w-4"></i>
                             <span class="tooltip">Word 저장</span>
                        </button>
                    </div>
                </div>
                <div id="finalSummary" class="p-6 h-96 overflow-y-auto custom-scrollbar text-slate-300 leading-relaxed space-y-4 flex-grow">
                    <p class="text-slate-500">녹음 종료 후 완결된 강의 노트가 생성됩니다.</p>
                </div>
            </div>
        </main>
        
        <div id="error-message" class="hidden fixed bottom-5 right-5 bg-red-600/90 backdrop-blur-sm border border-red-500/50 text-white py-4 px-6 rounded-lg shadow-xl z-50 flex flex-col gap-2 max-w-md animate-bounce">
            <div class="flex items-center gap-3 font-bold">
                <i data-lucide="alert-triangle" class="h-6 w-6"></i>
                <span>오류 발생</span>
            </div>
            <span id="error-text" class="text-sm font-mono break-all"></span>
            <button onclick="this.parentElement.classList.add('hidden')" class="text-xs underline text-right hover:text-gray-200 mt-2">닫기</button>
        </div>
        
    </div>

    <script>
        const style = document.createElement('style');
        style.innerHTML = `
            .save-btn { position: relative; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; background-color: #334155; color: #cbd5e1; border-radius: 9999px; border: 1px solid #475569; transition: all 0.2s ease-in-out; }
            .save-btn:hover:not(:disabled) { background-color: #475569; color: #ffffff; transform: translateY(-2px); }
            .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
            .tooltip { position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%); background-color: #0f172a; color: #ffffff; padding: 4px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity 0.2s ease-in-out; pointer-events: none; border: 1px solid #334155; }
            .group:hover .tooltip { opacity: 1; }
        `;
        document.head.appendChild(style);

        const recordBtn = document.getElementById('recordBtn');
        const micIconContainer = document.getElementById('micIconContainer'); 
        const statusText = document.getElementById('status-text');
        const statusIndicator = document.getElementById('status-indicator');
        const apiKeyInput = document.getElementById('apiKey');
        const toggleApiKey = document.getElementById('toggleApiKey');
        const eyeIconWrapper = document.getElementById('eyeIconWrapper');
        const titleInput = document.getElementById('titleInput');
        const contextInput = document.getElementById('contextInput');
        const errorMessageDiv = document.getElementById('error-message');
        const errorTextSpan = document.getElementById('error-text');
        const modelSelect = document.getElementById('modelSelect'); 
        const modelDesc = document.getElementById('modelDesc'); 
        const keyStatus = document.getElementById('keyStatus');
        
        const transcriptDiv = document.getElementById('transcript');
        const transcriptLoader = document.getElementById('transcriptLoader');
        const saveTranscriptTxtBtn = document.getElementById('saveTranscriptTxtBtn');
        const saveTranscriptDocBtn = document.getElementById('saveTranscriptDocBtn');

        const interimSummaryDiv = document.getElementById('interimSummary');
        const interimSummaryLoader = document.getElementById('interimSummaryLoader');
        const saveInterimSummaryTxtBtn = document.getElementById('saveInterimSummaryTxtBtn');
        const saveInterimSummaryDocBtn = document.getElementById('saveInterimSummaryDocBtn');

        const finalSummaryDiv = document.getElementById('finalSummary');
        const finalSummaryLoader = document.getElementById('finalSummaryLoader');
        const saveFinalSummaryTxtBtn = document.getElementById('saveFinalSummaryTxtBtn');
        const saveFinalSummaryDocBtn = document.getElementById('saveFinalSummaryDocBtn');

        const SVG_MIC = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>`;
        const SVG_STOP = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>`;

        let isRecording = false;
        let recognition;
        let fullTranscript = '';
        let transcriptHTML = '';
        let interimSummaryHTML = ''; 
        let isSummarizing = false;
        let isCorrecting = false;
        let isFinalizing = false;
        let summaryIntervalId = null;
        let correctionIntervalId = null;
        let lastInterimSummaryLength = 0; 
        let lastCorrectionLength = 0;
        let apiKeys = [];
        let currentKeyIndex = 0;

        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!window.SpeechRecognition) {
            showError('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 브라우저 사용을 권장합니다.');
            recordBtn.disabled = true;
            statusText.textContent = "브라우저 미지원";
        } else {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';
            setupRecognitionEventListeners();
        }

        if (location.protocol === 'file:') {
            alert("주의: 로컬 파일(file://)에서는 마이크 사용이 제한될 수 있습니다. 웹 서버 환경을 권장합니다.");
        }

        recordBtn.addEventListener('click', toggleRecording);
        toggleApiKey.addEventListener('click', () => {
            const type = apiKeyInput.type === 'password' ? 'text' : 'password';
            apiKeyInput.type = type;
            eyeIconWrapper.innerHTML = `<i data-lucide="${type === 'password' ? 'eye' : 'eye-off'}" class="h-5 w-5"></i>`;
            lucide.createIcons();
        });
        
        modelSelect.addEventListener('change', () => {
            const descriptions = {
                'gemini-2.5-flash': '속도와 성능의 균형이 잡힌 최신 Flash 모델입니다.',
                'gemini-2.5-pro': '가장 균형 잡힌 성능의 최신 모델입니다.',
                'gemini-3-pro': '최신 출시된 가장 똑똑한 모델입니다. (접근 권한 필요)',
                'gemini-1.5-pro': '안정적이고 검증된 고성능 모델입니다.',
                'gemini-1.5-flash': '속도가 가장 빠르고 가벼운 모델입니다.'
            };
            modelDesc.textContent = descriptions[modelSelect.value] || '';
        });

        apiKeyInput.addEventListener('input', updateApiKeys);

        saveTranscriptTxtBtn.addEventListener('click', () => saveContent(fullTranscript, generateFilename('녹취록', 'txt'), 'text/plain'));
        saveTranscriptDocBtn.addEventListener('click', () => saveContent(`<!DOCTYPE html><html><head><meta charset='utf-8'><title>${titleInput.value || 'Export'}</title></head><body>${transcriptHTML}</body></html>`, generateFilename('녹취록', 'doc'), 'application/vnd.ms-word'));
        saveInterimSummaryTxtBtn.addEventListener('click', () => saveContent(interimSummaryDiv.textContent, generateFilename('실시간요약', 'txt'), 'text/plain'));
        saveInterimSummaryDocBtn.addEventListener('click', () => saveContent(`<!DOCTYPE html><html><head><meta charset='utf-8'><title>${titleInput.value || 'Export'}</title></head><body>${interimSummaryDiv.innerHTML}</body></html>`, generateFilename('실시간요약', 'doc'), 'application/vnd.ms-word'));
        saveFinalSummaryTxtBtn.addEventListener('click', () => saveContent(finalSummaryDiv.textContent, generateFilename('강의노트', 'txt'), 'text/plain'));
        saveFinalSummaryDocBtn.addEventListener('click', () => saveContent(`<!DOCTYPE html><html><head><meta charset='utf-8'><title>${titleInput.value || 'Export'}</title></head><body>${finalSummaryDiv.innerHTML}</body></html>`, generateFilename('강의노트', 'doc'), 'application/vnd.ms-word'));

        const savedKeys = localStorage.getItem('geminiApiKey');
        if (savedKeys) {
            apiKeyInput.value = savedKeys;
            updateApiKeys();
        }

        function updateApiKeys() {
            const inputVal = apiKeyInput.value;
            apiKeys = inputVal.split(/[\n,]+/).map(k => k.trim()).filter(k => k.length > 0);
            if (apiKeys.length > 1) {
                keyStatus.textContent = `현재 ${apiKeys.length}개의 키 대기 중 (${currentKeyIndex + 1}번째 사용)`;
                keyStatus.classList.remove('hidden');
            } else {
                keyStatus.classList.add('hidden');
            }
            localStorage.setItem('geminiApiKey', inputVal);
        }

        function setupRecognitionEventListeners() {
            recognition.onstart = () => updateStatus('녹음 중...', 'recording');
            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interimTranscript += event.results[i][0].transcript;
                }
                if (transcriptDiv.querySelector('p.text-slate-500')) transcriptDiv.innerHTML = '';
                if (finalTranscript) {
                    fullTranscript += finalTranscript.trim() + ' ';
                    transcriptHTML += `<p class="mb-2">${finalTranscript.trim()}</p>`;
                }
                transcriptDiv.innerHTML = transcriptHTML + `<span class="text-slate-400">${interimTranscript}</span>`;
                transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
            };
            recognition.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') showError('마이크 권한이 차단되었습니다. 브라우저 설정에서 허용해주세요.');
                if (event.error !== 'no-speech') stopRecording();
            };
            recognition.onend = () => {
                if (isRecording) {
                    try { recognition.start(); } catch (e) { stopRecording(); }
                } else {
                    updateStatus('대기 중', 'idle');
                }
            };
        }
        
        async function toggleRecording() {
            if (isRecording) stopRecording();
            else await startRecording();
        }

        async function startRecording() {
            updateApiKeys();
            if (apiKeys.length === 0) {
                showError('Gemini API 키를 입력해주세요.');
                return;
            }
            try { await navigator.mediaDevices.getUserMedia({ audio: true }); } 
            catch (err) { showError("마이크 권한이 필요합니다."); return; }

            try {
                isRecording = true;
                clearInterval(summaryIntervalId);
                clearInterval(correctionIntervalId);

                if (fullTranscript.trim().length === 0) {
                    transcriptHTML = ''; 
                    interimSummaryHTML = '';
                    transcriptDiv.innerHTML = '<p class="text-slate-500">마이크를 통해 듣고 있습니다...</p>';
                    interimSummaryDiv.innerHTML = '<p class="text-slate-500">대화 내용이 감지되면 실시간으로 요약됩니다.</p>';
                    finalSummaryDiv.innerHTML = '<p class="text-slate-500">녹음 종료 후 완결된 강의 노트가 생성됩니다.</p>';
                    lastInterimSummaryLength = 0;
                    lastCorrectionLength = 0;
                } else {
                    transcriptHTML += '<div class="text-center my-2 text-sm text-indigo-400">--- 녹음 재개 ---</div>';
                    transcriptDiv.innerHTML = transcriptHTML;
                }
                
                micIconContainer.innerHTML = SVG_STOP;
                recordBtn.classList.remove('from-indigo-500', 'to-purple-600');
                recordBtn.classList.add('from-rose-500', 'to-red-600', 'pulse-live');
                recognition.start();
                
                summaryIntervalId = setInterval(() => {
                    const newText = fullTranscript.substring(lastInterimSummaryLength);
                    if (isRecording && !isSummarizing && newText.length > 400) updateInterimSummary(newText);
                }, 15000); 

                correctionIntervalId = setInterval(() => {
                    const newText = fullTranscript.substring(lastCorrectionLength);
                    if (isRecording && !isCorrecting && newText.length > 200) autoCorrectTranscript();
                }, 60000);

            } catch (err) {
                console.error("Start error:", err);
                showError("녹음 시작 실패. 페이지를 새로고침해주세요.");
                stopRecording();
            }
        }

        function stopRecording() {
            isRecording = false;
            clearInterval(summaryIntervalId);
            clearInterval(correctionIntervalId);
            try { recognition.stop(); } catch(e) {}
            
            micIconContainer.innerHTML = SVG_MIC;
            recordBtn.classList.add('from-indigo-500', 'to-purple-600');
            recordBtn.classList.remove('from-rose-500', 'to-red-600', 'pulse-live');
            updateStatus('대기 중', 'idle');
            
            const remainingText = fullTranscript.substring(lastCorrectionLength);
            if (!isCorrecting && remainingText.length > 10) {
                autoCorrectTranscript(true).then(() => {
                    if (fullTranscript.trim().length > 50) generateFinalSummary();
                });
            } else if (fullTranscript.trim().length > 50) {
                generateFinalSummary();
            }
            if (fullTranscript.trim().length > 10) setSaveButtonsDisabled(false, 'transcript');
        }

        async function callGeminiAPI(systemPrompt, userText) {
            updateApiKeys();
            if (apiKeys.length === 0) return null;
            
            let selectedModel = modelSelect.value;
            const context = contextInput.value.trim();
            let finalSystemPrompt = systemPrompt;
            if (context) finalSystemPrompt += `\n\n**중요 맥락 정보:** 이 녹취록은 다음 주제에 관한 것입니다: "${context}".`;

            const payload = {
                system_instruction: { parts: [{ text: finalSystemPrompt }] },
                contents: [{ parts: [{ text: userText }] }]
            };
            
            let attemptCount = 0;
            const maxAttempts = Math.max(apiKeys.length, 3); 

            while (attemptCount < maxAttempts) {
                const currentApiKey = apiKeys[currentKeyIndex % apiKeys.length];
                const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${currentApiKey}`;

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        return result.candidates?.[0]?.content?.parts?.[0]?.text;
                    }

                    if (response.status === 429) {
                        console.warn(`Key ${currentKeyIndex + 1} exhausted. Switching...`);
                        currentKeyIndex = (currentKeyIndex + 1) % apiKeys.length;
                        keyStatus.textContent = `할당량 초과! ${currentKeyIndex + 1}번째 키로 자동 전환됨`;
                        keyStatus.classList.remove('hidden', 'text-indigo-400');
                        keyStatus.classList.add('text-rose-400'); 
                        attemptCount++;
                        continue;
                    }
                    
                    // Fallback to Flash model if Pro fails with 500/503
                    if (response.status >= 500 && selectedModel.includes('pro') && !selectedModel.includes('flash')) {
                         console.warn("Pro model failed, trying Flash fallback...");
                         const flashURL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${currentApiKey}`;
                         const flashResp = await fetch(flashURL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                         if (flashResp.ok) {
                             const flashResult = await flashResp.json();
                             return flashResult.candidates?.[0]?.content?.parts?.[0]?.text;
                         }
                    }

                    const errData = await response.json();
                    throw new Error(errData.error.message || `HTTP Error ${response.status}`);

                } catch (error) {
                    console.error(`Attempt ${attemptCount} failed:`, error.message);
                    if (!error.message.includes('429')) await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attemptCount)));
                    attemptCount++;
                    
                    // Show last error to user
                    if (attemptCount >= maxAttempts) {
                        showError(`API 호출 최종 실패: ${error.message}`);
                    }
                }
            }
            return null;
        }

        async function autoCorrectTranscript(isFinal = false) {
            if (isCorrecting) return;
            const textToCorrect = fullTranscript.substring(lastCorrectionLength);
            if (textToCorrect.length < 10) return;

            isCorrecting = true;
            transcriptLoader.classList.remove('hidden');
            const systemPrompt = `당신은 한국어 받아쓰기 전문가입니다. 문맥을 파악하여 오탈자만 교정하세요. 설명 없이 교정된 텍스트만 출력하세요.`;
            const correctedSegment = await callGeminiAPI(systemPrompt, textToCorrect);

            if (correctedSegment) {
                const originalTranscriptBefore = fullTranscript.substring(0, lastCorrectionLength);
                fullTranscript = originalTranscriptBefore + correctedSegment + " ";
                transcriptHTML = fullTranscript.split('\n').map(p => `<p class="mb-2">${p}</p>`).join('');
                transcriptDiv.innerHTML = transcriptHTML;
                lastCorrectionLength = fullTranscript.length;
                if(isFinal) showError("최종 녹취록 보정이 완료되었습니다.", 3000, 'success');
            }
            isCorrecting = false;
            transcriptLoader.classList.add('hidden');
        }
        
        async function updateInterimSummary(textToProcess) {
            if (isSummarizing) return;
            isSummarizing = true;
            
            // [Bug Fix] Capture the length of the chunk currently being processed
            const currentChunkLength = textToProcess.length;
            
            interimSummaryLoader.classList.remove('hidden');
            setSaveButtonsDisabled(true, 'interimSummary');

            const systemPrompt = `실시간 요약 전문가입니다. 입력된 텍스트의 핵심 내용을 불렛 포인트로 요약하세요. 서론 없이 본론만 출력하세요.`;
            const summaryText = await callGeminiAPI(systemPrompt, textToProcess);

            if (summaryText) {
                let formattedSummary = summaryText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                if (interimSummaryHTML) interimSummaryHTML += '<hr class="border-slate-700 my-4">';
                interimSummaryHTML += formattedSummary;
                interimSummaryDiv.innerHTML = `<div class="whitespace-pre-wrap">${interimSummaryHTML}</div>`;
                setSaveButtonsDisabled(false, 'interimSummary');
                
                // [Bug Fix] Update lastInterimSummaryLength by ADDING the processed chunk length
                // instead of resetting it to fullTranscript.length, which might ignore text arrived during API call.
                lastInterimSummaryLength += currentChunkLength;
            }
            interimSummaryDiv.scrollTop = interimSummaryDiv.scrollHeight;
            isSummarizing = false;
            interimSummaryLoader.classList.add('hidden');
        }

        async function generateFinalSummary() {
            if (isFinalizing) return;
            isFinalizing = true;
            finalSummaryLoader.classList.remove('hidden');
            setSaveButtonsDisabled(true, 'finalSummary');
            finalSummaryDiv.innerHTML = `<div class="flex items-center justify-center h-full"><div class="text-center"><i data-lucide="loader-circle" class="h-8 w-8 animate-spin text-rose-400 mx-auto"></i><p class="text-rose-400 mt-2">강의 노트를 작성 중입니다...</p></div></div>`;
            lucide.createIcons();

            const systemPrompt = `# Role Definition
당신은 대학원 수준의 '전문 학술 조교'입니다.
녹취록과 실시간 요약본을 종합하여 [완결된 강의 노트]를 작성하세요.

# Processing Rules
1. 구어체 제거 및 문어체 정제
2. [대주제 - 소주제 - 근거/사례 - 결론] 구조화
3. 전문 용어 정확히 명기

# Output Format
## 1. 강의 개요
* 주제: (한 줄 요약)
* 핵심 요약: (3문장 이내)

## 2. 주요 개념 및 용어
* [용어]: (정의)

## 3. 상세 강의 노트
### (1) [주제 1]
* 내용...`; 
            
            const summaryContent = interimSummaryDiv.innerText || "요약본 없음";
            const combinedInput = `[녹취록]\n${fullTranscript}\n\n[실시간 요약본]\n${summaryContent}`;
            const summaryText = await callGeminiAPI(systemPrompt, combinedInput);

            if (summaryText) {
                let formattedSummary = summaryText.replace(/\*\*(.*?)\*\*/g, '<b class="text-rose-200">$1</b>').replace(/\n/g, '<br>');
                finalSummaryDiv.innerHTML = `<div class="whitespace-pre-wrap leading-relaxed">${formattedSummary}</div>`;
                setSaveButtonsDisabled(false, 'finalSummary');
            } else {
                finalSummaryDiv.innerHTML = `<p class="text-red-400">강의 노트 생성 실패. 에러 메시지를 확인하세요.</p>`;
            }
            finalSummaryDiv.scrollTop = finalSummaryDiv.scrollHeight;
            isFinalizing = false;
            finalSummaryLoader.classList.add('hidden');
        }

        function updateStatus(text, state) {
            statusText.textContent = text;
            statusIndicator.className = 'h-2.5 w-2.5 rounded-full transition-colors';
            const stateClasses = { recording: ['bg-red-500'], idle: ['bg-slate-500'] };
            statusIndicator.classList.add(...(stateClasses[state] || stateClasses.idle));
        }
        
        function showError(message, duration = 5000, type = 'error') {
            errorTextSpan.textContent = message;
            errorMessageDiv.classList.remove('hidden');
            if(type === 'success') {
                errorMessageDiv.classList.replace('bg-red-600/90', 'bg-green-600/90');
                errorMessageDiv.classList.replace('border-red-500/50', 'border-green-500/50');
            } else {
                errorMessageDiv.classList.replace('bg-green-600/90', 'bg-red-600/90');
                errorMessageDiv.classList.replace('border-green-500/50', 'border-red-500/50');
            }
            if (duration > 0) setTimeout(() => errorMessageDiv.classList.add('hidden'), duration);
        }

        function generateFilename(prefix, extension) {
            const titleText = titleInput.value.trim().replace(/[\/\\?%*:|"<>]/g, '-');
            const timestamp = new Date().toISOString().slice(0, 19).replace(/[-T:]/g, '');
            return titleText ? `${titleText}_${prefix}.${extension}` : `${prefix}_${timestamp}.${extension}`;
        }

        async function saveContent(content, filename, contentType) {
            if (!content || !content.trim()) { showError('저장할 내용이 없습니다.'); return; }
            const blob = new Blob([content], { type: contentType });
            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({ suggestedName: filename });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    showError('파일이 저장되었습니다.', 3000, 'success');
                    return;
                } catch (err) { if (err.name !== 'AbortError') showError('파일 저장 실패. 다운로드 방식으로 진행합니다.'); else return; }
            }
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        }

        function setSaveButtonsDisabled(disabled, type = 'all') {
            const buttons = {
                transcript: [saveTranscriptTxtBtn, saveTranscriptDocBtn],
                interimSummary: [saveInterimSummaryTxtBtn, saveInterimSummaryDocBtn],
                finalSummary: [saveFinalSummaryTxtBtn, saveFinalSummaryDocBtn]
            };
            if (type === 'all') Object.values(buttons).flat().forEach(btn => btn.disabled = disabled);
            else if (buttons[type]) buttons[type].forEach(btn => btn.disabled = disabled);
        }
        
        lucide.createIcons();
    </script>
