<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 강의록 요약</title>

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
    <!-- Firebase v9 compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(ellipse 80% 80% at 50% -20%, rgba(56, 189, 248, 0.15), rgba(255, 255, 255, 0));
            min-height: 100vh;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        .pulse-live { animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            50% { box-shadow: 0 0 0 15px rgba(220, 38, 38, 0); }
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(51, 65, 85, 0.6);
        }
        .save-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background-color: #334155;
            color: #cbd5e1;
            border-radius: 9999px;
            border: 1px solid #475569;
            transition: all 0.2s;
        }
        .save-btn:hover:not(:disabled) { background-color: #475569; color: #ffffff; }
        .save-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .tooltip {
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #0f172a;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s;
            border: 1px solid #334155;
            z-index: 10;
        }
        .group:hover .tooltip { opacity: 1; }
        .premium-border { position: relative; }
        .premium-border::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            z-index: -1;
            opacity: 0.3;
        }
    </style>
</head>
<body class="text-slate-200 antialiased">
    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        <header class="text-center mb-10 mt-6">
            <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-br from-white to-slate-400 bg-clip-text text-transparent tracking-tight">
                AI 강의록 요약
                <span class="inline-block text-sm md:text-lg font-bold text-slate-400 align-top ml-2 border border-slate-500/40 bg-slate-500/10 px-3 py-1 rounded-md mb-2 md:mb-0 shadow-[0_0_15px_rgba(148,163,184,0.2)]">
                    V8.1 FLASH-LITE
                </span>
            </h1>
            <p class="text-slate-400 mt-4 max-w-2xl mx-auto leading-relaxed">
                <b>빠르고 정확한 AI 강의록 요약 도구입니다.</b> 실시간 녹취, 중간 요약, 최종 노트까지 한 번에 정리할 수 있습니다.
            </p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 mb-10">
            <div class="lg:col-span-1 flex flex-col gap-4">
                <div class="glass-panel rounded-2xl p-5 flex flex-col h-[650px] shadow-xl">
                    <h3 class="text-lg font-semibold text-white flex items-center gap-2 mb-4">
                        <i data-lucide="hard-drive" class="h-5 w-5 text-slate-400"></i> 시스템 상태
                    </h3>
                    <!-- Firebase 설정 입력 -->
                    <div class="space-y-3 mb-4">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Project ID</label>
                            <input type="text" id="fbProjectId" class="bg-slate-900/80 border border-slate-700 text-slate-200 text-xs rounded-lg block w-full p-2" placeholder="your-project-id">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">API Key</label>
                            <input type="password" id="fbApiKey" class="bg-slate-900/80 border border-slate-700 text-slate-200 text-xs rounded-lg block w-full p-2" placeholder="AIza...">
                        </div>
                        <button id="fbConnectBtn" class="w-full bg-sky-600/80 hover:bg-sky-600 text-white text-xs font-semibold py-2 rounded-lg transition-all flex items-center justify-center gap-2">
                            <i data-lucide="cloud" class="h-3.5 w-3.5"></i> Firebase 연결
                        </button>
                        <div id="fbStatus" class="text-center text-xs text-slate-500 flex items-center justify-center gap-1.5">
                            <span id="fbDot" class="h-1.5 w-1.5 rounded-full bg-slate-600 inline-block"></span>
                            <span id="fbStatusText">연결 안 됨</span>
                        </div>
                    </div>
                    <div class="border-t border-slate-700/50 pt-3 flex-grow flex flex-col min-h-0">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-semibold text-slate-400">저장된 노트</span>
                            <button id="fbRefreshBtn" class="text-slate-500 hover:text-slate-300 transition-colors">
                                <i data-lucide="refresh-cw" class="h-3.5 w-3.5"></i>
                            </button>
                        </div>
                        <div id="fbHistoryList" class="flex-grow overflow-y-auto custom-scrollbar space-y-2 text-xs text-slate-500 italic">
                            Firebase 연결 후 불러옵니다.
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">
                <div class="grid grid-cols-1 gap-4">
                    <div class="glass-panel p-5 rounded-xl shadow-lg premium-border">
                        <label for="apiKey" class="block text-sm font-medium text-slate-300 mb-2 flex justify-between items-center">
                            <span class="flex items-center gap-2"><i data-lucide="key" class="h-4 w-4 text-amber-400"></i> Gemini API 키</span>
                            <span class="text-[10px] bg-slate-500/10 text-slate-400 px-2 py-0.5 rounded border border-slate-500/20 flex items-center gap-1">
                                <i data-lucide="server" class="h-3 w-3"></i> Local
                            </span>
                        </label>
                        <div class="relative">
                            <input type="password" id="apiKey" class="bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-sky-500 block w-full p-3 pr-10" placeholder="Gemini API 키를 입력하세요">
                            <button type="button" id="toggleApiKey" class="absolute inset-y-0 right-0 px-3 text-slate-400 hover:text-white focus:outline-none">
                                <span id="eyeIconWrapper"><i data-lucide="eye" class="h-5 w-5"></i></span>
                            </button>
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4">
                        <div class="glass-panel p-5 rounded-xl shadow-lg">
                            <label for="titleInput" class="block text-sm font-medium text-slate-400 mb-2">회의/강의 제목</label>
                            <input type="text" id="titleInput" class="bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-sky-500 block w-full p-3" placeholder="예: 프로젝트 기획 회의">
                        </div>
                        <div class="glass-panel p-5 rounded-xl shadow-lg">
                            <label for="contextInput" class="block text-sm font-medium text-slate-400 mb-2">AI 가이드 (맥락 정보)</label>
                            <input type="text" id="contextInput" class="bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-sky-500 block w-full p-3" placeholder="예: 주요 결정사항 위주로 정리">
                        </div>
                    </div>
                </div>

                <div class="flex flex-col items-center justify-center py-6">
                    <button type="button" id="recordBtn" class="bg-gradient-to-br from-sky-500 to-indigo-600 text-white font-bold h-24 w-24 rounded-full shadow-2xl hover:scale-105 transition-all flex items-center justify-center focus:outline-none focus:ring-4 focus:ring-sky-500/50">
                        <span id="micIconContainer"><i data-lucide="mic" class="h-10 w-10"></i></span>
                    </button>
                    <div id="status" class="mt-4 text-slate-400 flex items-center space-x-2 bg-slate-800/80 px-4 py-2 rounded-full border border-slate-700">
                        <div id="status-indicator" class="h-2 w-2 rounded-full bg-slate-500 transition-colors duration-500"></div>
                        <span id="status-text" class="font-medium text-xs">시스템 대기 중</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass-panel rounded-2xl flex flex-col h-[400px] overflow-hidden">
                        <div class="p-4 border-b border-slate-700/50 bg-slate-900/40 flex justify-between items-center">
                            <h2 class="text-sm font-semibold text-white flex items-center gap-2">
                                <i data-lucide="mic-2" class="h-4 w-4 text-sky-400"></i> 실시간 녹취
                            </h2>
                            <button type="button" id="saveTranscriptTxtBtn" disabled class="save-btn group">
                                <i data-lucide="download" class="h-3.5 w-3.5"></i>
                                <span class="tooltip">TXT 저장</span>
                            </button>
                        </div>
                        <div id="transcript" class="p-5 overflow-y-auto custom-scrollbar flex-grow text-sm leading-relaxed text-slate-300">
                            <p class="text-slate-600 italic">마이크 권한을 허용하고 녹음을 시작하세요.</p>
                        </div>
                    </div>

                    <div class="glass-panel rounded-2xl flex flex-col h-[400px] overflow-hidden">
                        <div class="p-4 border-b border-slate-700/50 bg-slate-900/40 flex justify-between items-center">
                            <h2 class="text-sm font-semibold text-white flex items-center gap-2">
                                <i data-lucide="sparkles" class="h-4 w-4 text-amber-400"></i> 실시간 요약
                            </h2>
                            <div class="flex items-center gap-2">
                                <div id="interimSummaryLoader" class="hidden"><i data-lucide="loader-circle" class="h-4 w-4 animate-spin text-amber-400"></i></div>
                                <button type="button" id="saveInterimSummaryBtn" disabled class="save-btn group">
                                    <i data-lucide="download" class="h-3.5 w-3.5"></i>
                                    <span class="tooltip">MD 저장</span>
                                </button>
                            </div>
                        </div>
                        <div id="interimSummary" class="p-5 overflow-y-auto custom-scrollbar flex-grow text-sm leading-relaxed text-slate-300">
                            <p class="text-slate-600 italic">자동 요약 대기 중...</p>
                        </div>
                    </div>
                </div>

                <div class="glass-panel rounded-2xl flex flex-col min-h-[400px] shadow-2xl border-t border-sky-500/20">
                    <div class="p-5 border-b border-slate-700/50 bg-slate-900/60 flex justify-between items-center">
                        <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                            <i data-lucide="book-open-check" class="h-5 w-5 text-purple-400"></i> 최종 정리 노트
                        </h2>
                        <button type="button" id="saveFinalSummaryDocBtn" disabled class="bg-sky-500/20 hover:bg-sky-500/30 text-sky-400 border border-sky-500/30 px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2">
                            <i data-lucide="file-text" class="h-4 w-4"></i> .docx 다운로드
                        </button>
                    </div>
                    <div id="finalSummary" class="p-8 prose prose-invert prose-slate max-w-none">
                        <div class="text-center py-20 text-slate-600">녹음 종료 후 전체 내용을 분석하여 완벽한 노트가 생성됩니다.</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="error-message" class="fixed bottom-6 right-6 bg-rose-900/95 backdrop-blur-md text-white py-4 px-5 rounded-xl shadow-2xl z-50 flex items-start gap-3 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none border border-rose-500/30">
            <i data-lucide="alert-triangle" class="h-5 w-5 text-rose-300"></i>
            <span id="error-text" class="text-sm font-medium"></span>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // ── Firebase 연결 ───────────────────────────────────────────────────
        function updateFbStatus(connected, msg) {
            document.getElementById('fbDot').className =
                'h-1.5 w-1.5 rounded-full inline-block ' +
                (connected ? 'bg-emerald-400' : 'bg-slate-600');
            document.getElementById('fbStatusText').textContent = msg;
        }

        async function loadHistory() {
            if (!fbDb) return;
            const list = document.getElementById('fbHistoryList');
            list.innerHTML = '<span class="text-slate-600">불러오는 중...</span>';
            try {
                const snap = await fbDb.collection('lectures')
                    .orderBy('createdAt', 'desc').limit(20).get();
                if (snap.empty) {
                    list.innerHTML = '<span class="text-slate-600 italic">저장된 노트가 없습니다.</span>';
                    return;
                }
                list.innerHTML = '';
                snap.forEach(doc => {
                    const d = doc.data();
                    const item = document.createElement('div');
                    item.className = 'bg-slate-800/60 rounded-lg p-2.5 border border-slate-700/50 cursor-pointer hover:border-sky-500/40 transition-colors';
                    const dt = d.createdAt?.toDate?.() ?? new Date();
                    item.innerHTML = `
                        <div class="font-semibold text-slate-300 truncate">${d.title || '(제목 없음)'}</div>
                        <div class="text-slate-500 mt-0.5">${dt.toLocaleString('ko-KR')}</div>`;
                    item.addEventListener('click', () => loadNoteIntoView(doc.id, d));
                    list.appendChild(item);
                });
            } catch (e) {
                list.innerHTML = '<span class="text-rose-400">불러오기 실패: ' + e.message + '</span>';
            }
        }

        function loadNoteIntoView(id, data) {
            currentDocId = id;
            finalSummaryRawMarkdown = data.finalSummary || '';
            fullTranscript = data.transcript || '';
            titleInput.value = data.title || '';

            if (fullTranscript) {
                transcriptDiv.innerHTML = fullTranscript.split('\n')
                    .filter(l => l.trim())
                    .map(l => `<p class="mb-3 border-l-2 border-sky-500/50 pl-3 text-slate-400">${l}</p>`)
                    .join('');
            }
            if (finalSummaryRawMarkdown) {
                finalSummaryDiv.innerHTML = marked.parse(finalSummaryRawMarkdown);
                document.getElementById('saveFinalSummaryDocBtn').disabled = false;
            }
            if (data.summaryHistory?.length) {
                summaryHistory = data.summaryHistory;
                interimSummaryDiv.innerHTML = '';
                summaryHistory.forEach(s => {
                    const block = document.createElement('div');
                    block.className = 'p-4 bg-slate-800/50 rounded-xl border border-slate-700 mb-4 prose prose-invert prose-xs max-w-none';
                    block.innerHTML = marked.parse(s);
                    interimSummaryDiv.appendChild(block);
                });
                document.getElementById('saveInterimSummaryBtn').disabled = false;
            }
            showToast('노트를 불러왔습니다.', 'success');
        }

        async function saveToFirebase(isUpdate) {
            if (!fbDb) return;
            const payload = {
                title: titleInput.value || '(제목 없음)',
                transcript: fullTranscript,
                summaryHistory: summaryHistory,
                finalSummary: finalSummaryRawMarkdown,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            try {
                if (isUpdate && currentDocId) {
                    await fbDb.collection('lectures').doc(currentDocId).update(payload);
                } else {
                    payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    const ref = await fbDb.collection('lectures').add(payload);
                    currentDocId = ref.id;
                }
                showToast('Firebase에 저장되었습니다.', 'success');
                loadHistory();
            } catch (e) {
                showError('Firebase 저장 실패: ' + e.message);
            }
        }

        document.getElementById('fbConnectBtn').addEventListener('click', () => {
            const projectId = document.getElementById('fbProjectId').value.trim();
            const apiKey    = document.getElementById('fbApiKey').value.trim();
            if (!projectId || !apiKey) { showError('Project ID와 API Key를 모두 입력하세요.'); return; }

            try {
                if (fbApp) { firebase.app().delete(); fbApp = null; fbDb = null; }
                fbApp = firebase.initializeApp({
                    apiKey,
                    projectId,
                    authDomain: `${projectId}.firebaseapp.com`
                });
                fbDb = fbApp.firestore();
                updateFbStatus(true, '연결됨 · ' + projectId);
                lucide.createIcons();
                loadHistory();
            } catch (e) {
                updateFbStatus(false, '연결 실패');
                showError('Firebase 초기화 오류: ' + e.message);
            }
        });

        document.getElementById('fbRefreshBtn').addEventListener('click', () => {
            if (!fbDb) { showError('Firebase가 연결되지 않았습니다.'); return; }
            loadHistory();
        });

        // 성공 토스트 (기존 에러 토스트 재사용 + 색상 전환)
        function showToast(message, type) {
            if (type === 'success') {
                errorText.textContent = message;
                errorToast.classList.remove('bg-rose-900/95', 'border-rose-500/30', 'translate-y-20', 'opacity-0', 'pointer-events-none');
                errorToast.classList.add('bg-emerald-900/95', 'border-emerald-500/30');
                setTimeout(() => {
                    errorToast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
                    errorToast.classList.remove('bg-emerald-900/95', 'border-emerald-500/30');
                    errorToast.classList.add('bg-rose-900/95', 'border-rose-500/30');
                }, 3000);
            } else {
                showError(message);
            }
        }

        let isRecording = false;
        let isProcessing = false;
        let isRecognizing = false;
        let recognition = null;
        let fullTranscript = '';
        let lastProcessedLength = 0;
        let isSummarizing = false;
        let summaryInterval = null;
        let summaryHistory = [];
        let finalSummaryRawMarkdown = '';

        // Firebase
        let fbApp = null;
        let fbDb  = null;
        let currentDocId = null;

        const recordBtn = document.getElementById('recordBtn');
        const micIconContainer = document.getElementById('micIconContainer');
        const statusText = document.getElementById('status-text');
        const statusIndicator = document.getElementById('status-indicator');
        const apiKeyInput = document.getElementById('apiKey');
        const titleInput = document.getElementById('titleInput');
        const contextInput = document.getElementById('contextInput');
        const transcriptDiv = document.getElementById('transcript');
        const interimSummaryDiv = document.getElementById('interimSummary');
        const finalSummaryDiv = document.getElementById('finalSummary');
        const errorToast = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');

        function showError(message) {
            errorText.textContent = message;
            errorToast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                errorToast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 5000);
        }

        function updateStatus(text, state) {
            statusText.textContent = text;
            statusIndicator.className = 'h-2 w-2 rounded-full ' + (
                state === 'recording' ? 'bg-rose-500 shadow-lg' :
                state === 'processing' ? 'bg-amber-400 animate-pulse' :
                'bg-slate-500'
            );
        }

        async function callGeminiAPI(systemPrompt, userText) {
            const currentKey = apiKeyInput.value.trim();
            if (!currentKey) {
                showError('API 키를 입력해주세요.');
                return null;
            }

            const model = 'gemini-3.1-flash-lite-preview';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${currentKey}`;
            const payload = {
                systemInstruction: { parts: [{ text: systemPrompt }] },
                contents: [{ parts: [{ text: userText }] }]
            };

            const delays = [1000, 2000, 4000, 8000, 16000];
            let lastErrorMsg = '';

            for (let i = 0; i <= delays.length; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        let errMsg = `HTTP ${response.status}`;
                        try {
                            const errData = await response.json();
                            errMsg = errData.error?.message || errMsg;
                        } catch (e) {}
                        throw new Error(`[${response.status}] ${errMsg}`);
                    }

                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || null;
                } catch (error) {
                    lastErrorMsg = error.message;
                    if (lastErrorMsg.includes('[400]') || lastErrorMsg.includes('[403]') || lastErrorMsg.includes('[404]')) break;
                    if (i === delays.length) break;
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }

            console.error('AI 통신 오류:', lastErrorMsg);
            showError('AI 통신 오류: ' + lastErrorMsg);
            return null;
        }

        async function processInterimSummary() {
            if (isSummarizing || !isRecording) return;

            const chunk = fullTranscript.substring(lastProcessedLength).trim();
            if (chunk.length < 40) return;

            isSummarizing = true;
            document.getElementById('interimSummaryLoader').classList.remove('hidden');

            const prompt = `
당신은 실시간 STT 녹취록을 학습용 노트로 구조화하는 전문 에디터입니다.
제공되는 입력 데이터는 실시간 음성 인식 결과물이므로 오탈자가 있거나 문장의 앞뒤가 끊겨 불완전할 수 있습니다. 

다음 규칙을 반드시 준수하여 요약본을 작성하세요:
1. 문맥상 무의미한 추임새(아, 어, 음, 그 등)는 생략하고 비문은 매끄럽게 교정하세요.
2. 문장이 중간에 잘린 것처럼 보이더라도 입력된 사실 범위 내에서만 핵심을 도출하세요. 절대로 없는 사실을 상상해서 채워 넣지 마세요(환각 현상 엄금).
3. 핵심 개념, 수치, 고유명사는 마크다운(**굵게**) 기법으로 시각적 강조를 적용하세요.
4. 결과물은 인사말이나 부연 설명 없이, 오직 아래 명시된 마크다운 불렛포인트 형식으로만 출력하세요.

[출력 서식]
- **주요 키워드 및 개념**
  - 해당 키워드에 대한 상세 설명 및 핵심 사실 정리
  - 언급된 구체적인 데이터나 수치 기록`;

    const userText = `[맥락 정보]
- 강의/회의 제목: ${titleInput.value || '미정'}

[실시간 입력 데이터]
${chunk}
`;

            const result = await callGeminiAPI(prompt, userText);

            if (result) {
                lastProcessedLength = fullTranscript.length;
                summaryHistory.push(result);
                const block = document.createElement('div');
                block.className = 'p-4 bg-slate-800/50 rounded-xl border border-slate-700 mb-4 prose prose-invert prose-xs max-w-none';
                block.innerHTML = marked.parse(result);

                if (interimSummaryDiv.querySelector('p.italic')) interimSummaryDiv.innerHTML = '';
                interimSummaryDiv.appendChild(block);
                interimSummaryDiv.scrollTop = interimSummaryDiv.scrollHeight;
                document.getElementById('saveInterimSummaryBtn').disabled = false;
            }

            isSummarizing = false;
            document.getElementById('interimSummaryLoader').classList.add('hidden');
            lucide.createIcons();
        }

        async function generateFinalSummary() {
            if (fullTranscript.trim().length === 0) {
                updateStatus('대기 중', 'idle');
                return;
            }

            updateStatus('최종 분석 중...', 'processing');

            const prompt = `[System]
당신은 최고 수준의 비즈니스 분석가이자 교육 콘텐츠 에디터입니다.

[Task]
제공된 전체 녹취록과 가이드를 바탕으로 전문적인 최종 마크다운 문서를 작성하세요.

[Rules]
1. 가이드를 우선 반영
2. 원본에 없는 내용은 작성 금지
3. 아래 형식을 반드시 준수

[Output Format]
# ${titleInput.value || '미정'}
> **한 줄 요약:** 전체 핵심 요약

## 1. 개요
- **배경 및 목적:**
- **핵심 주제:**

## 2. 주요 내용
- **핵심 키워드 1**
  - 상세 내용
- **핵심 키워드 2**
  - 상세 내용

[Input]
- 가이드: ${contextInput.value}
- 전체 녹취록: ${fullTranscript}`;

            const result = await callGeminiAPI(prompt, fullTranscript);

            if (result) {
                finalSummaryRawMarkdown = result;
                finalSummaryDiv.innerHTML = marked.parse(result);
                document.getElementById('saveFinalSummaryDocBtn').disabled = false;
                updateStatus('분석 완료', 'idle');
                // 최종 노트 완성 시 Firebase 자동 저장
                if (fbDb) saveToFirebase(!!currentDocId);
            } else {
                updateStatus('분석 실패', 'idle');
            }
        }

        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (window.SpeechRecognition) {
    recognition = new window.SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true; // 실시간 텍스트 변화 감지
    recognition.lang = 'ko-KR';

    recognition.onstart = () => {
        isRecognizing = true;
        updateStatus('녹음 중...', 'recording');
    };

    recognition.onresult = (event) => {
        let finalChunk = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
                finalChunk += event.results[i][0].transcript + ' ';
            }
        }
        
        if (finalChunk) {
            fullTranscript += finalChunk;
            if (transcriptDiv.querySelector('p.italic')) transcriptDiv.innerHTML = '';
            
            // 가독성을 위해 문장 단위로 깔끔하게 한 줄씩 추가
            transcriptDiv.innerHTML += `<p class="mb-3 border-l-2 border-sky-500 pl-3 text-slate-300">${finalChunk.trim()}</p>`;
            
            // 브라우저 렌더링 타이밍을 고려한 부드러운 스크롤 포커스
            requestAnimationFrame(() => {
                transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
            });
            
            document.getElementById('saveTranscriptTxtBtn').disabled = false;
        }
    };

    recognition.onerror = (e) => {
        console.warn('Speech Recognition Error:', e.error);
        
        if (e.error === 'not-allowed') {
            showError('마이크 권한이 거부되었습니다. 브라우저 권한 설정을 확인해주세요.');
            stopRecordingAndAnalyze();
        } else if (e.error === 'network') {
            showError('네트워크 연결이 일시적으로 불안정합니다. STT를 재연결합니다.');
        }
        // 'aborted' 나 'no-speech' 에러는 onend에서 자연스럽게 재시작되므로 별도 차단하지 않음
    };

    recognition.onend = () => {
        isRecognizing = false;
        
        // 사용자가 명시적으로 중단한 게 아니라면 (녹음 중 상태 유지 시) 안전하게 재시작
        if (isRecording) {
            setTimeout(() => {
                if (isRecording && !isRecognizing) {
                    try { 
                        recognition.start(); 
                    } catch (err) {
                        console.error('STT 재시작 실패:', err);
                    }
                }
            }, 400); // 0.4초의 안전 딜레이를 주어 브라우저 과부하 방지
        }
    };
}
        async function stopRecordingAndAnalyze() {
            isRecording = false;

            if (recognition && isRecognizing) {
                try { recognition.stop(); } catch (e) {}
            }
            if (summaryInterval) clearInterval(summaryInterval);

            if (fullTranscript.trim().length === 0) {
                isProcessing = false;
                updateStatus('대기 중', 'idle');
                micIconContainer.innerHTML = '<i data-lucide="mic" class="h-10 w-10"></i>';
                recordBtn.classList.remove('pulse-live', 'bg-rose-600', 'bg-slate-700', 'cursor-not-allowed', 'opacity-80');
                recordBtn.classList.add('bg-gradient-to-br', 'from-sky-500', 'to-indigo-600', 'hover:scale-105');
                transcriptDiv.innerHTML = '<p class="text-slate-600 italic">마이크 권한을 허용하고 녹음을 시작하세요.</p>';
                interimSummaryDiv.innerHTML = '<p class="text-slate-600 italic">자동 요약 대기 중...</p>';
                finalSummaryDiv.innerHTML = '<div class="text-center py-20 text-slate-600">녹음 종료 후 전체 내용을 분석하여 완벽한 노트가 생성됩니다.</div>';
                lucide.createIcons();
                return;
            }

            isProcessing = true;
            updateStatus('AI 분석 중...', 'processing');
            micIconContainer.innerHTML = '<i data-lucide="loader-circle" class="h-10 w-10 animate-spin"></i>';
            recordBtn.classList.remove('pulse-live', 'bg-rose-600', 'hover:scale-105');
            recordBtn.classList.add('bg-slate-700', 'cursor-not-allowed', 'opacity-80');
            lucide.createIcons();

            try {
                await processInterimSummary();
                await generateFinalSummary();
            } catch (err) {
                console.error(err);
                showError('분석 중 오류가 발생했습니다.');
            } finally {
                isProcessing = false;
                micIconContainer.innerHTML = '<i data-lucide="mic" class="h-10 w-10"></i>';
                recordBtn.classList.remove('bg-slate-700', 'cursor-not-allowed', 'opacity-80');
                recordBtn.classList.add('bg-gradient-to-br', 'from-sky-500', 'to-indigo-600', 'hover:scale-105');
                if (statusText.textContent.includes('분석 중') || statusText.textContent.includes('처리 중')) {
                    updateStatus('대기 중', 'idle');
                }
                lucide.createIcons();
            }
        }

        recordBtn.addEventListener('click', async (e) => {
            e.preventDefault();

            if (!recognition) {
                showError('현재 브라우저는 음성 인식을 지원하지 않습니다. Chrome 환경을 이용해주세요.');
                return;
            }

            if (isProcessing) {
                showError('이전 녹음 데이터를 분석 중입니다. 잠시만 기다려주세요.');
                return;
            }

            if (!isRecording) {
                const currentKey = apiKeyInput.value.trim();
                if (!currentKey) {
                    showError('API 키를 반드시 입력해주세요.');
                    apiKeyInput.focus();
                    return;
                }

                isRecording = true;
                fullTranscript = '';
                summaryHistory = [];
                lastProcessedLength = 0;
                finalSummaryRawMarkdown = '';
                document.getElementById('saveTranscriptTxtBtn').disabled = true;
                document.getElementById('saveInterimSummaryBtn').disabled = true;
                document.getElementById('saveFinalSummaryDocBtn').disabled = true;
                transcriptDiv.innerHTML = '<p class="text-slate-600 italic">녹음 중입니다... 말씀을 시작하세요.</p>';
                interimSummaryDiv.innerHTML = '<p class="text-slate-600 italic">요약 분석 대기 중...</p>';
                finalSummaryDiv.innerHTML = '<div class="text-center py-20 text-slate-600">녹음 종료 후 분석이 시작됩니다.</div>';

                try {
                    if (!isRecognizing) recognition.start();
                    updateStatus('녹음 중...', 'recording');
                    micIconContainer.innerHTML = '<i data-lucide="square" class="h-10 w-10 fill-current"></i>';
                    recordBtn.classList.add('pulse-live', 'bg-rose-600');
                    recordBtn.classList.remove('from-sky-500', 'to-indigo-600');
                    lucide.createIcons();
                    summaryInterval = setInterval(processInterimSummary, 15000);
                } catch (err) {
                    showError('마이크 시작 오류: ' + err.message);
                    isRecording = false;
                }
            } else {
                stopRecordingAndAnalyze();
            }
        });

        document.getElementById('toggleApiKey').addEventListener('click', (e) => {
            e.preventDefault();
            apiKeyInput.type = apiKeyInput.type === 'password' ? 'text' : 'password';
            document.getElementById('eyeIconWrapper').innerHTML = `<i data-lucide="${apiKeyInput.type === 'password' ? 'eye' : 'eye-off'}" class="h-5 w-5"></i>`;
            lucide.createIcons();
        });

        document.getElementById('saveTranscriptTxtBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (!fullTranscript) return;
            const blob = new Blob([fullTranscript], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${titleInput.value || '강의록'}_원본.txt`;
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('saveFinalSummaryDocBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            if (!finalSummaryRawMarkdown) return;

            try {
                const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType, Table, TableRow, TableCell, WidthType, BorderStyle } = docx;

                const lines = finalSummaryRawMarkdown.split('\n');
                const children = [];

                for (const line of lines) {
                    const trimmed = line.trimEnd();

                    if (trimmed.startsWith('# ')) {
                        children.push(new Paragraph({
                            text: trimmed.slice(2),
                            heading: HeadingLevel.HEADING_1,
                            spacing: { after: 200 }
                        }));
                    } else if (trimmed.startsWith('## ')) {
                        children.push(new Paragraph({
                            text: trimmed.slice(3),
                            heading: HeadingLevel.HEADING_2,
                            spacing: { before: 240, after: 120 }
                        }));
                    } else if (trimmed.startsWith('### ')) {
                        children.push(new Paragraph({
                            text: trimmed.slice(4),
                            heading: HeadingLevel.HEADING_3,
                            spacing: { before: 160, after: 80 }
                        }));
                    } else if (trimmed.startsWith('> ')) {
                        children.push(new Paragraph({
                            children: [new TextRun({ text: trimmed.slice(2), italics: true, color: '555555' })],
                            indent: { left: 720 },
                            spacing: { after: 120 },
                            border: { left: { style: BorderStyle.SINGLE, size: 6, color: '4A9EBE' } }
                        }));
                    } else if (/^(\s*)-\s+\*\*(.+?)\*\*(.*)$/.test(trimmed)) {
                        const m = trimmed.match(/^(\s*)-\s+\*\*(.+?)\*\*(.*)$/);
                        const indent = m[1].length > 0 ? 1440 : 720;
                        children.push(new Paragraph({
                            children: [
                                new TextRun({ text: m[2], bold: true }),
                                new TextRun({ text: m[3] || '' })
                            ],
                            bullet: { level: m[1].length > 0 ? 1 : 0 },
                            spacing: { after: 60 }
                        }));
                    } else if (/^(\s*)-\s+(.+)$/.test(trimmed)) {
                        const m = trimmed.match(/^(\s*)-\s+(.+)$/);
                        const isSubBullet = m[1].length > 0;
                        let runText = m[2].replace(/\*\*(.+?)\*\*/g, '$1');
                        const hasBold = /\*\*/.test(m[2]);
                        children.push(new Paragraph({
                            children: [new TextRun({ text: runText, bold: false })],
                            bullet: { level: isSubBullet ? 1 : 0 },
                            spacing: { after: 60 }
                        }));
                    } else if (trimmed === '---') {
                        children.push(new Paragraph({
                            children: [],
                            border: { bottom: { style: BorderStyle.SINGLE, size: 2, color: 'CCCCCC' } },
                            spacing: { before: 120, after: 120 }
                        }));
                    } else if (trimmed === '') {
                        children.push(new Paragraph({ text: '', spacing: { after: 60 } }));
                    } else {
                        const boldParts = trimmed.split(/\*\*(.+?)\*\*/g);
                        const runs = boldParts.map((part, idx) =>
                            new TextRun({ text: part, bold: idx % 2 === 1 })
                        );
                        children.push(new Paragraph({ children: runs, spacing: { after: 80 } }));
                    }
                }

                const docTitle = titleInput.value || '강의노트';
                const now = new Date().toLocaleString('ko-KR');

                const document = new Document({
                    styles: {
                        default: {
                            document: {
                                run: { font: 'Malgun Gothic', size: 22 }
                            }
                        }
                    },
                    sections: [{
                        properties: {
                            page: {
                                margin: { top: 1440, right: 1080, bottom: 1440, left: 1080 }
                            }
                        },
                        children: [
                            new Paragraph({
                                children: [new TextRun({ text: '생성일시: ' + now, size: 18, color: '888888' })],
                                alignment: AlignmentType.RIGHT,
                                spacing: { after: 240 }
                            }),
                            ...children
                        ]
                    }]
                });

                const blob = await Packer.toBlob(document);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${docTitle}.docx`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (err) {
                console.error(err);
                showError('.docx 생성 오류: ' + err.message);
            }
        });

        document.getElementById('saveInterimSummaryBtn').addEventListener('click', (e) => {
            e.preventDefault();
            if (summaryHistory.length === 0) return;
            const mdHeader = `# ${titleInput.value || '강의 실시간 요약'}\n> 본 문서는 AI가 실시간으로 분석한 상세 요약본입니다.\n\n---\n\n`;
            const mdContent = mdHeader + summaryHistory.join('\n\n---\n\n');
            const blob = new Blob([mdContent], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${titleInput.value || '실시간요약_상세'}.md`;
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
