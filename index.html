<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 강의록 요약 (V7.1.0 - Cloud Sync Edition)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(ellipse 80% 80% at 50% -20%, rgba(56, 189, 248, 0.15), rgba(255, 255, 255, 0));
            min-height: 100vh;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .pulse-live { animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            50% { box-shadow: 0 0 0 15px rgba(220, 38, 38, 0); }
        }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(51, 65, 85, 0.6);
        }
        
        .save-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px; height: 32px;
            background-color: #334155;
            color: #cbd5e1;
            border-radius: 9999px;
            border: 1px solid #475569;
            transition: all 0.2s;
        }
        .save-btn:hover:not(:disabled) { background-color: #475569; color: #ffffff; }
        .save-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .tooltip {
            position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%);
            background-color: #0f172a; color: #ffffff; padding: 4px 8px; border-radius: 4px;
            font-size: 11px; white-space: nowrap; opacity: 0; pointer-events: none;
            transition: 0.2s; border: 1px solid #334155; z-index: 10;
        }
        .group:hover .tooltip { opacity: 1; }

        .history-item:hover { background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.4); }

        .premium-border { position: relative; }
        .premium-border::before {
            content: ""; position: absolute; inset: -1px; border-radius: inherit;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            z-index: -1; opacity: 0.3;
        }
    </style>
</head>
<body class="text-slate-200 antialiased">
    <div class="container mx-auto p-4 md:p-8 max-w-7xl">
        
        <header class="text-center mb-10 mt-6">
            <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-br from-white to-slate-400 bg-clip-text text-transparent tracking-tight">
                AI 강의록 요약 
                <span class="inline-block text-sm md:text-lg font-bold text-sky-400 align-top ml-2 border border-sky-500/40 bg-sky-500/10 px-3 py-1 rounded-md mb-2 md:mb-0 shadow-[0_0_15px_rgba(56,189,248,0.3)]">
                    V7.1 CLOUD FIXED
                </span>
            </h1>
            <p class="text-slate-400 mt-4 max-w-2xl mx-auto leading-relaxed">
                <b>안정적인 서버 동기화.</b> 권한 오류를 해결하고 더 빠르고 안정적인 클라우드 연결을 제공합니다.
            </p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 mb-10">
            <!-- Sidebar: History -->
            <div class="lg:col-span-1 flex flex-col gap-4">
                <div class="glass-panel rounded-2xl p-5 flex flex-col h-[650px] shadow-xl">
                    <h3 class="text-lg font-semibold text-white flex items-center gap-2 mb-4">
                        <i data-lucide="history" class="h-5 w-5 text-sky-400"></i> 저장된 기록
                    </h3>
                    <div id="historyList" class="flex-grow overflow-y-auto custom-scrollbar space-y-2">
                        <div class="text-center py-10 text-slate-500 text-sm opacity-50">
                            연결 대기 중...
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="lg:col-span-3 space-y-6">
                <!-- 설정 영역 -->
                <div class="grid grid-cols-1 gap-4">
                    <div class="glass-panel p-5 rounded-xl shadow-lg premium-border">
                        <label for="apiKey" class="block text-sm font-medium text-slate-300 mb-2 flex justify-between items-center">
                            <span class="flex items-center gap-2"><i data-lucide="key" class="h-4 w-4 text-amber-400"></i> Gemini API 키</span>
                            <span id="cloudStatus" class="text-[10px] bg-slate-500/10 text-slate-400 px-2 py-0.5 rounded border border-slate-500/20 flex items-center gap-1">
                                <i data-lucide="cloud-off" class="h-3 w-3"></i> Connecting...
                            </span>
                        </label>
                        <div class="relative">
                            <input type="password" id="apiKey" class="bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-sky-500 block w-full p-3 pr-10" placeholder="Google AI Studio 키를 입력하세요">
                            <button id="toggleApiKey" class="absolute inset-y-0 right-0 px-3 text-slate-400 hover:text-white">
                                <span id="eyeIconWrapper"><i data-lucide="eye" class="h-5 w-5"></i></span>
                            </button>
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4">
                        <div class="glass-panel p-5 rounded-xl shadow-lg">
                            <label for="titleInput" class="block text-sm font-medium text-slate-400 mb-2">회의/강의 제목</label>
                            <input type="text" id="titleInput" class="bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-sky-500 block w-full p-3" placeholder="예: AI 비즈니스 전략 강의">
                        </div>
                        <div class="glass-panel p-5 rounded-xl shadow-lg">
                            <label for="contextInput" class="block text-sm font-medium text-slate-400 mb-2">AI 가이드 (맥락 정보)</label>
                            <input type="text" id="contextInput" class="bg-slate-900/80 border border-slate-700 text-slate-200 text-sm rounded-lg focus:ring-2 focus:ring-sky-500 block w-full p-3" placeholder="예: 주요 결정사항 위주로 정리 요망">
                        </div>
                    </div>
                </div>

                <!-- 녹음 컨트롤 -->
                <div class="flex flex-col items-center justify-center py-6">
                    <button id="recordBtn" class="bg-gradient-to-br from-sky-500 to-indigo-600 text-white font-bold h-24 w-24 rounded-full shadow-2xl hover:scale-105 transition-all flex items-center justify-center">
                        <span id="micIconContainer">
                            <i data-lucide="mic" class="h-10 w-10"></i>
                        </span>
                    </button>
                    <div id="status" class="mt-4 text-slate-400 flex items-center space-x-2 bg-slate-800/80 px-4 py-2 rounded-full border border-slate-700">
                        <div id="status-indicator" class="h-2 w-2 rounded-full bg-slate-500 transition-colors duration-500"></div>
                        <span id="status-text" class="font-medium text-xs">시스템 대기 중</span>
                    </div>
                </div>

                <!-- 디스플레이 패널 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass-panel rounded-2xl flex flex-col h-[400px] overflow-hidden">
                        <div class="p-4 border-b border-slate-700/50 bg-slate-900/40 flex justify-between items-center">
                            <h2 class="text-sm font-semibold text-white flex items-center gap-2">
                                <i data-lucide="mic-2" class="h-4 w-4 text-sky-400"></i> 실시간 녹취
                            </h2>
                            <button id="saveTranscriptTxtBtn" disabled class="save-btn group">
                                <i data-lucide="download" class="h-3.5 w-3.5"></i>
                                <span class="tooltip">TXT 저장</span>
                            </button>
                        </div>
                        <div id="transcript" class="p-5 overflow-y-auto custom-scrollbar flex-grow text-sm leading-relaxed text-slate-300">
                            <p class="text-slate-600 italic">녹음 시작 시 텍스트가 표시됩니다.</p>
                        </div>
                    </div>

                    <div class="glass-panel rounded-2xl flex flex-col h-[400px] overflow-hidden">
                        <div class="p-4 border-b border-slate-700/50 bg-slate-900/40 flex justify-between items-center">
                            <h2 class="text-sm font-semibold text-white flex items-center gap-2">
                                <i data-lucide="sparkles" class="h-4 w-4 text-amber-400"></i> 실시간 요약
                            </h2>
                            <div id="interimSummaryLoader" class="hidden"><i data-lucide="loader-circle" class="h-4 w-4 animate-spin text-amber-400"></i></div>
                        </div>
                        <div id="interimSummary" class="p-5 overflow-y-auto custom-scrollbar flex-grow text-sm text-slate-300">
                            <p class="text-slate-600 italic">자동 요약 대기 중...</p>
                        </div>
                    </div>
                </div>

                <!-- 최종 노트 -->
                <div class="glass-panel rounded-2xl flex flex-col min-h-[400px] shadow-2xl border-t border-sky-500/20">
                    <div class="p-5 border-b border-slate-700/50 bg-slate-900/60 flex justify-between items-center">
                        <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                            <i data-lucide="book-open-check" class="h-5 w-5 text-purple-400"></i> 최종 정리 노트
                        </h2>
                        <button id="saveFinalSummaryDocBtn" disabled class="bg-sky-500/20 hover:bg-sky-500/30 text-sky-400 border border-sky-500/30 px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2">
                            <i data-lucide="file-word" class="h-4 w-4"></i> Word 다운로드
                        </button>
                    </div>
                    <div id="finalSummary" class="p-8 prose prose-invert prose-slate max-w-none">
                        <div class="text-center py-20 text-slate-600">
                            녹음 종료 후 서버 분석을 통해 완벽한 노트가 생성됩니다.
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 에러 알림 -->
        <div id="error-message" class="fixed bottom-6 right-6 bg-rose-900/90 backdrop-blur-md text-white py-4 px-5 rounded-xl shadow-2xl z-50 flex items-start gap-3 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
            <i data-lucide="alert-circle" class="h-5 w-5 text-rose-300"></i>
            <span id="error-text" class="text-sm"></span>
        </div>
    </div>

    <!-- Firebase v11 Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lecture-summarizer-v7';

        let currentUser = null;

        // UI Elements
        const recordBtn = document.getElementById('recordBtn');
        const micIconContainer = document.getElementById('micIconContainer'); 
        const statusText = document.getElementById('status-text');
        const statusIndicator = document.getElementById('status-indicator');
        const apiKeyInput = document.getElementById('apiKey');
        const titleInput = document.getElementById('titleInput');
        const contextInput = document.getElementById('contextInput');
        const historyList = document.getElementById('historyList');
        const transcriptDiv = document.getElementById('transcript');
        const interimSummaryDiv = document.getElementById('interimSummary');
        const finalSummaryDiv = document.getElementById('finalSummary');
        const errorToast = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const cloudStatus = document.getElementById('cloudStatus');

        let isRecording = false;
        let recognition;
        let fullTranscript = '';
        let transcriptHTML = '';
        let lastProcessedLength = 0;
        let isSummarizing = false;
        let summaryInterval = null;
        let summaryHistory = [];
        let finalSummaryRawMarkdown = '';

        lucide.createIcons();

        // Error Handling Utility
        function showError(message) {
            errorText.textContent = message;
            errorToast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => errorToast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none'), 4000);
        }

        function updateStatus(text, state) {
            statusText.textContent = text;
            statusIndicator.className = 'h-2 w-2 rounded-full ' + (state === 'recording' ? 'bg-rose-500 shadow-lg' : state === 'processing' ? 'bg-amber-400 animate-pulse' : 'bg-slate-500');
        }

        // --- Auth Initialization (Rule 3) ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Error:", error);
                showError("인증 실패: " + error.message);
            }
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                console.log("Auth Success:", user.uid);
                cloudStatus.innerHTML = '<i data-lucide="cloud-check" class="h-3 w-3"></i> Cloud Connected';
                cloudStatus.classList.remove('text-slate-400', 'border-slate-500/20');
                cloudStatus.classList.add('text-emerald-400', 'border-emerald-500/20');
                lucide.createIcons();
                loadLectureHistory();
            }
        });

        // Start Auth
        initAuth();

        // --- Firestore Operations (Rule 1 & 2) ---
        async function loadLectureHistory() {
            if (!currentUser) return;
            
            try {
                // Rule 1: Correct path artifacts/{appId}/users/{userId}/lectures
                const lecturesRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'lectures');
                
                // Rule 2: Simple query only, sort in memory
                const snapshot = await getDocs(lecturesRef);
                const lectures = [];
                snapshot.forEach(doc => {
                    lectures.push({ id: doc.id, ...doc.data() });
                });

                // Sort in memory by timestamp
                lectures.sort((a, b) => b.timestamp - a.timestamp);
                renderHistoryList(lectures);
            } catch (error) {
                console.error("Firestore Load Error:", error);
                if (error.code === 'permission-denied') {
                    showError("서버 권한 오류가 발생했습니다. 잠시 후 다시 시도하세요.");
                }
                historyList.innerHTML = '<div class="text-xs text-rose-500 p-4 text-center">데이터를 불러오지 못했습니다.</div>';
            }
        }

        async function saveLectureToCloud() {
            if (!currentUser || !fullTranscript) return;
            try {
                const lecturesRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'lectures');
                await addDoc(lecturesRef, {
                    title: titleInput.value || "제목 없는 강의",
                    context: contextInput.value || "",
                    transcript: fullTranscript,
                    summary: finalSummaryRawMarkdown,
                    interimSummaries: summaryHistory,
                    timestamp: Date.now()
                });
                loadLectureHistory();
            } catch (error) {
                console.error("Firestore Save Error:", error);
                showError("클라우드 저장 실패: " + error.message);
            }
        }

        function renderHistoryList(lectures) {
            if (lectures.length === 0) {
                historyList.innerHTML = '<div class="text-center py-10 text-slate-600 text-sm italic">기록이 없습니다.</div>';
                return;
            }
            historyList.innerHTML = lectures.map(lec => `
                <div class="history-item p-3 rounded-xl border border-slate-700/50 cursor-pointer transition-all bg-slate-900/30 group mb-2" data-id="${lec.id}">
                    <div class="text-sm font-medium text-slate-200 truncate group-hover:text-sky-400">${lec.title}</div>
                    <div class="text-[10px] text-slate-500 mt-1">${new Date(lec.timestamp).toLocaleString()}</div>
                </div>
            `).join('');

            // Click event for history items
            historyList.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', () => loadLectureDetail(item.dataset.id, lectures));
            });
        }

        function loadLectureDetail(id, lectures) {
            const data = lectures.find(l => l.id === id);
            if (!data) return;

            titleInput.value = data.title;
            contextInput.value = data.context;
            fullTranscript = data.transcript;
            finalSummaryRawMarkdown = data.summary;
            summaryHistory = data.interimSummaries || [];

            transcriptDiv.innerHTML = `<div class="text-sky-400 text-xs font-bold mb-4 flex items-center gap-1"><i data-lucide="cloud-check" class="h-3 w-3"></i> 클라우드에서 불러옴</div>` + 
                fullTranscript.split(' ').reduce((acc, word, i) => {
                    if (i % 20 === 0) acc += '</p><p class="mb-3">';
                    return acc + word + ' ';
                }, '<p class="mb-3">') + '</p>';
            
            interimSummaryDiv.innerHTML = summaryHistory.map(s => `
                <div class="p-3 bg-slate-800/40 rounded-lg border border-slate-700 mb-3 text-xs prose prose-invert prose-slate prose-p:my-0">${marked.parse(s)}</div>
            `).join('');

            finalSummaryDiv.innerHTML = marked.parse(data.summary);
            document.getElementById('saveFinalSummaryDocBtn').disabled = false;
            document.getElementById('saveTranscriptTxtBtn').disabled = false;
            lucide.createIcons();
        }

        // --- AI Logic ---
        async function callGeminiAPI(systemPrompt, userText) {
            const currentKey = apiKeyInput.value.trim();
            if (!currentKey) { showError("Gemini API 키를 입력해주세요."); return null; }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash:generateContent?key=${currentKey}`;
            const payload = {
                systemInstruction: { parts: [{ text: systemPrompt }] },
                contents: [{ parts: [{ text: userText }] }],
                generationConfig: { temperature: 0.2 }
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || null;
            } catch (error) {
                showError("AI 분석 실패");
                return null;
            }
        }

        async function processInterimSummary() {
            if (isSummarizing || !isRecording) return;
            const chunk = fullTranscript.substring(lastProcessedLength).trim();
            if (chunk.length < 100) return;

            isSummarizing = true;
            document.getElementById('interimSummaryLoader').classList.remove('hidden');
            const result = await callGeminiAPI(`당신은 속기사입니다. [제목: ${titleInput.value}]의 대화를 불렛포인트로 요약하세요.`, chunk);
            
            if (result) {
                lastProcessedLength = fullTranscript.length;
                summaryHistory.push(result);
                const block = document.createElement('div');
                block.className = 'p-4 bg-slate-800/50 rounded-xl border border-slate-700 mb-4 prose prose-invert prose-xs prose-p:my-0';
                block.innerHTML = marked.parse(result);
                if (interimSummaryDiv.querySelector('p.italic')) interimSummaryDiv.innerHTML = '';
                interimSummaryDiv.appendChild(block);
                interimSummaryDiv.scrollTop = interimSummaryDiv.scrollHeight;
            }
            isSummarizing = false;
            document.getElementById('interimSummaryLoader').classList.add('hidden');
        }

        async function generateFinalSummary() {
            if (fullTranscript.length < 50) return;
            updateStatus('최종 분석 중...', 'processing');
            const result = await callGeminiAPI(`전체 녹취록을 바탕으로 [제목: ${titleInput.value}]에 대한 전문적인 강의 노트를 마크다운으로 작성하세요. 개요, 본문, 액션 아이템을 포함하세요.`, fullTranscript);
            
            if (result) {
                finalSummaryRawMarkdown = result;
                finalSummaryDiv.innerHTML = marked.parse(result);
                document.getElementById('saveFinalSummaryDocBtn').disabled = false;
                await saveLectureToCloud();
                updateStatus('Cloud Saved', 'idle');
            } else {
                updateStatus('생성 실패', 'idle');
            }
        }

        // --- Speech Recognition ---
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (window.SpeechRecognition) {
            recognition = new window.SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';

            recognition.onresult = (event) => {
                let interim = '';
                let final = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) final += event.results[i][0].transcript + ' ';
                    else interim += event.results[i][0].transcript;
                }
                if (final) {
                    fullTranscript += final;
                    if (transcriptDiv.querySelector('p.italic')) transcriptDiv.innerHTML = '';
                    transcriptDiv.innerHTML += `<p class="mb-3 border-l-2 border-sky-500 pl-3">${final}</p>`;
                    transcriptDiv.scrollTop = transcriptDiv.scrollHeight;
                    document.getElementById('saveTranscriptTxtBtn').disabled = false;
                }
            };
            recognition.onend = () => { if (isRecording) recognition.start(); };
        }

        recordBtn.addEventListener('click', async () => {
            if (!isRecording) {
                if (!apiKeyInput.value) { showError("Gemini API 키가 필요합니다."); return; }
                isRecording = true;
                fullTranscript = ''; summaryHistory = []; transcriptDiv.innerHTML = ''; interimSummaryDiv.innerHTML = '';
                recognition.start();
                updateStatus('녹음 중...', 'recording');
                micIconContainer.innerHTML = '<i data-lucide="square" class="h-10 w-10 fill-current"></i>';
                recordBtn.classList.add('pulse-live', 'bg-rose-600');
                recordBtn.classList.remove('from-sky-500', 'to-indigo-600');
                summaryInterval = setInterval(processInterimSummary, 20000);
            } else {
                isRecording = false;
                recognition.stop();
                clearInterval(summaryInterval);
                updateStatus('처리 중...', 'processing');
                micIconContainer.innerHTML = '<i data-lucide="mic" class="h-10 w-10"></i>';
                recordBtn.classList.remove('pulse-live', 'bg-rose-600');
                recordBtn.classList.add('bg-gradient-to-br', 'from-sky-500', 'to-indigo-600');
                await processInterimSummary();
                await generateFinalSummary();
            }
            lucide.createIcons();
        });

        // Toggle Password
        document.getElementById('toggleApiKey').addEventListener('click', () => {
            apiKeyInput.type = apiKeyInput.type === 'password' ? 'text' : 'password';
            document.getElementById('eyeIconWrapper').innerHTML = `<i data-lucide="${apiKeyInput.type === 'password' ? 'eye' : 'eye-off'}" class="h-5 w-5"></i>`;
            lucide.createIcons();
        });

        // Download Logic
        document.getElementById('saveTranscriptTxtBtn').addEventListener('click', () => {
            const blob = new Blob([fullTranscript], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `${titleInput.value || '강의록'}.txt`;
            a.click();
        });
        
        document.getElementById('saveFinalSummaryDocBtn').addEventListener('click', () => {
            const html = `<html><head><meta charset="utf-8"></head><body>${marked.parse(finalSummaryRawMarkdown)}</body></html>`;
            const blob = new Blob([html], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `${titleInput.value || '강의노트'}.doc`;
            a.click();
        });
    </script>
</body>
</html>
