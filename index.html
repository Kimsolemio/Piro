<style>

.save-btn {

<script>
lucide.createIcons();

// ────────────────────────────────────────────────────────────────
// [FIREBASE DEFAULT CONFIGURATION]
// 아래 객체에 Firebase Project ID와 API Key를 미리 적어 두면,
// 사용자가 화면에서 정보를 입력할 필요 없이 데이터베이스가 즉시 자동 연결됩니다.
// ────────────────────────────────────────────────────────────────
const DEFAULT_FIREBASE_CONFIG = {
projectId: "Piro-4ed95", // 여기에 Firebase Project ID 기입 가능
apiKey: "AIzaSyCwRrUhzLVn2HzneSybZY7HXbCruKtf2_U"     // 여기에 Firebase API Key 기입 가능
};

// Left sidebar accordion toggle
const toggleFbInputsBtn = document.getElementById('toggleFbInputs');
const fbInputsWrapper = document.getElementById('fbInputsWrapper');
const fbChevron = document.getElementById('fbChevron');
let fbCollapsed = true; // default collapsed in SaaS sidebar

toggleFbInputsBtn.addEventListener('click', () => {
fbCollapsed = !fbCollapsed;
if (fbCollapsed) {
fbInputsWrapper.style.maxHeight = '0px';
fbInputsWrapper.style.padding = '0px';
fbInputsWrapper.style.borderWidth = '0px';
fbChevron.setAttribute('data-lucide', 'chevron-down');
} else {
fbInputsWrapper.style.maxHeight = '500px';
fbInputsWrapper.style.padding = '0.75rem';
fbInputsWrapper.style.borderWidth = '1px';
fbChevron.setAttribute('data-lucide', 'chevron-up');
}
lucide.createIcons();
});

// ── Firebase status updates ─────────────────────────────────────────
function updateFbStatus(connected, msg) {
const fbDot = document.getElementById('fbDot');
const fbBadge = document.getElementById('badge-firebase');

fbDot.className = 'h-1.5 w-1.5 rounded-full inline-block ' + (connected ? 'bg-emerald-500' : 'bg-slate-600');
document.getElementById('fbStatusText').textContent = msg;

if (connected) {
fbBadge.className = 'bg-emerald-950/80 text-emerald-400 border border-emerald-800/40 px-2.5 py-1 rounded-lg flex items-center gap-1.5 shadow-sm';
fbBadge.innerHTML = '<span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span> DB 연결됨';
} else {
fbBadge.className = 'bg-slate-900/80 text-slate-500 border border-slate-800 px-2.5 py-1 rounded-lg flex items-center gap-1.5 shadow-sm';
fbBadge.innerHTML = '<span class="h-1.5 w-1.5 rounded-full bg-slate-600"></span> DB 대기';
}
lucide.createIcons();
}

async function loadHistory() {
if (!fbDb) return;
const list = document.getElementById('fbHistoryList');
list.innerHTML = '<span class="text-slate-500 text-[10px]">노트를 동기화하는 중...</span>';
try {
const snap = await fbDb.collection('lectures')
.orderBy('createdAt', 'desc').limit(20).get();
if (snap.empty) {
list.innerHTML = '<span class="text-slate-650 italic">저장된 강의 요약본이 존재하지 않습니다.</span>';
return;
}
list.innerHTML = '';
snap.forEach(doc => {
const d = doc.data();
const item = document.createElement('div');
item.className = 'note-item rounded-xl p-2.5 cursor-pointer';
const dt = d.createdAt?.toDate?.() ?? new Date();
item.innerHTML = `
                       <div class="font-bold text-slate-300 truncate flex items-center gap-1.5">
                           <i data-lucide="file-text" class="h-3.5 w-3.5 text-slate-400"></i>
                           ${d.title || '(제목 미정)'}
                       </div>
                       <div class="text-slate-500 text-[9px] mt-1.5 flex items-center justify-between">
                           <span>${dt.toLocaleString('ko-KR')}</span>
                           <span class="text-blue-400 font-semibold">보관 완료</span>
                       </div>`;
item.addEventListener('click', () => loadNoteIntoView(doc.id, d));
list.appendChild(item);
});
lucide.createIcons();
} catch (e) {
list.innerHTML = '<span class="text-red-400">동기화 실패: ' + e.message + '</span>';
}
}

function loadNoteIntoView(id, data) {
currentDocId = id;
finalSummaryRawMarkdown = data.finalSummary || '';
fullTranscript = data.transcript || '';
aiTranscript = data.aiTranscript || data.transcript || ''; // AI교정본이 있으면 우선 로드, 없으면 원본으로 대체
titleInput.value = data.title || '';

if (aiTranscript) {
// AI 교정 속기록 패널에 로드
aiTranscriptContainer.innerHTML = '';
aiTranscript.split('\n')
.filter(l => l.trim())
.forEach(l => {
const bubble = document.createElement('div');
bubble.className = 'transcript-bubble text-slate-300 mb-2 whitespace-pre-wrap';
bubble.textContent = l;
aiTranscriptContainer.appendChild(bubble);
});

async function callGeminiAPI(systemPrompt, userText) {
const currentKey = apiKeyInput.value.trim();
if (!currentKey) {
showError('Gemini API Key를 입력해주십시오.');
return null;
}

const model = document.getElementById('modelSelect').value || 'gemini-3.5-flash';
const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${currentKey}`;
const payload = {
systemInstruction: { parts: [{ text: systemPrompt }] },
contents: [{ parts: [{ text: userText }] }]
};

const delays = [1000, 2000, 4000, 8000, 16000];
let lastErrorMsg = '';

for (let i = 0; i <= delays.length; i++) {
try {
const response = await fetch(url, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
});

if (!response.ok) {
let errMsg = `HTTP ${response.status}`;
try {
const errData = await response.json();
errMsg = errData.error?.message || errMsg;
} catch (e) {}
throw new Error(`[${response.status}] ${errMsg}`);
}

const data = await response.json();
return data.candidates?.[0]?.content?.parts?.[0]?.text || null;
} catch (error) {
lastErrorMsg = error.message;
if (lastErrorMsg.includes('[400]') || lastErrorMsg.includes('[403]') || lastErrorMsg.includes('[404]')) break;
if (i === delays.length) break;
await new Promise(r => setTimeout(r, delays[i]));
}
}

console.error('AI 분석망 통신 오류:', lastErrorMsg);
showError('AI 분석망 통신 오류: ' + lastErrorMsg);
return null;
}

다음 규칙을 반드시 준수하여 요약본을 작성하세요:

async function triggerChunkPolishing(isFinal = false) {
const currentKey = apiKeyInput.value.trim();
if (!currentKey || isPolishingChunk || !isRecording) return;

const startIdx = lastPolishedLength;
const endIdx = fullTranscript.length;
const chunk = fullTranscript.substring(startIdx, endIdx).trim();

const minChars = isFinal ? 15 : 400; // 문단 단위 전송을 위해 최소 기준을 400자로 완화
if (chunk.length < minChars) return;

isPolishingChunk = true;
document.getElementById('interimSummaryLoader').classList.remove('hidden');

const model = document.getElementById('modelSelect').value || 'gemini-3.5-flash';
const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${currentKey}`;

const prompt = `당신은 실시간 속기 및 요약 전문가입니다. 제공된 한국어 음성 인식 텍스트(거친 텍스트)를 맞춤법 교정하고, 동시에 해당 청크의 핵심을 불렛마크로 요약해 주십시오.
단순 교정뿐만 아니라, 화제나 맥락이 전환되는 지점에서는 자연스럽게 줄바꿈(\\n\\n)을 넣어 문단을 나누어 주십시오.
반드시 아래 JSON 포맷을 그대로 준수하여 단 한 단어의 다른 부연설명도 없이 순수 JSON 결과만 출력하십시오:
{
 "polishedText": "맞춤법 교정 및 적절히 문단이 나뉜 텍스트. 생략 없이 모든 내용 보존.",
 "bulletSummary": "요약 불렛마크들 (마크다운)"
}`;

const payload = {
contents: [{
parts: [
{ text: prompt },
{ text: `[거친 텍스트]\n${chunk}` }
]
}],
generationConfig: {
responseMimeType: "application/json",
responseSchema: {
type: "OBJECT",
properties: {
polishedText: { type: "STRING" },
bulletSummary: { type: "STRING" }
},
required: ["polishedText", "bulletSummary"]
}
}
};

const delays = [1000, 2000, 4000, 8000];
let successData = null;

for (let i = 0; i <= delays.length; i++) {
try {
const response = await fetch(url, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
});

if (response.ok) {
successData = await response.json();
break; // 성공 시 루프 탈출
} else {
if (response.status === 429) {
console.warn(`API Rate Limit (429) 감지. ${delays[i] || '재시도 포기'}ms 대기 후 재시도...`);
} else if (response.status >= 400 && response.status < 500 && response.status !== 429) {
break; // 400, 403, 404 등 클라이언트 오류는 재시도하지 않음
}
if (i === delays.length) break;
await new Promise(r => setTimeout(r, delays[i]));
}
} catch (err) {
console.error('API Fetch 에러:', err);
if (i === delays.length) break;
await new Promise(r => setTimeout(r, delays[i]));
}
}

if (successData) {
let rawJson = successData.candidates?.[0]?.content?.parts?.[0]?.text;
if (rawJson) {
// 마크다운 백틱 및 json 태그 제거하여 안전한 파싱 유도
rawJson = rawJson.replace(/```(json)?|```/g, '').trim();
const parsed = JSON.parse(rawJson);
const polishedText = parsed.polishedText || '';
const bulletSummary = parsed.bulletSummary || '';

if (polishedText) {
if (aiTranscript.length > 0) {
aiTranscript += '\n\n' + polishedText; // 새 문단은 엔터 두 번으로 확실히 분리
} else {
aiTranscript = polishedText;
}

aiTranscriptContainer.innerHTML = '';
const p = document.createElement('p');
p.className = 'text-slate-300 leading-relaxed whitespace-pre-wrap';
p.textContent = aiTranscript;
aiTranscriptContainer.appendChild(p);
aiTranscriptContainer.scrollTop = aiTranscriptContainer.scrollHeight;
document.getElementById('saveTranscriptTxtBtn').disabled = false;
}

if (bulletSummary) {
summaryHistory.push(bulletSummary);
const block = document.createElement('div');
block.className = 'p-3 bg-slate-900/60 rounded-xl border border-slate-800/60 mb-3 prose prose-invert prose-xs max-w-none';
block.innerHTML = marked.parse(bulletSummary);

if (interimSummaryDiv.querySelector('p.italic')) {
interimSummaryDiv.innerHTML = '';
}
interimSummaryDiv.appendChild(block);
interimSummaryDiv.scrollTop = interimSummaryDiv.scrollHeight;
document.getElementById('saveInterimSummaryBtn').disabled = false;
}
}
}
} catch (err) {
console.error('실시간 청크 교정 및 요약 파싱 실패:', err);
} finally {
// 성공이든 실패든 포인터를 전진시켜 무한 반복 재시도 버그 차단
lastPolishedLength = endIdx;

isPolishingChunk = false;
document.getElementById('interimSummaryLoader').classList.add('hidden');
lucide.createIcons();

// If more text has accumulated while calling the API, trigger again
const remainingChunk = fullTranscript.substring(lastPolishedLength).trim();
if (remainingChunk.length >= 400 && isRecording) {
setTimeout(() => triggerChunkPolishing(false), 1000);
}
}
}

async function generateFinalSummary() {
if (fullTranscript.trim().length === 0) {
updateStatus('AI 대기 중', 'idle');
return;
}

updateStatus('최종 요약 분석 중...', 'processing');

const prompt = `[System]
당신은 최고 수준의 교육 콘텐츠 에디터이자 전문 요약 전문가입니다.

[Task]
제공된 전체 녹취록과 가이드 지침을 바탕으로 깔끔하고 격식 있는 마크다운 요약 강의 노트를 작성하세요.

[Rules]
1. 가이드 지침을 성실히 반영
2. 원본 기록에 없는 정보 지어내지 말 것 (사실에 기반)
3. 아래 강의 노트 양식을 엄수

[Output Format]
# ${titleInput.value || '강의 및 회의 기록'}
> **핵심 요약:** 본 문서는 강좌 및 회의 내용을 AI 기반으로 자동 요약 정리한 노트입니다.

## 1. 개요 및 취지
- **기록 목적 및 배경:**
- **주요 핵심 주제:**

## 2. 주요 핵심 내용
- **주요 키워드 1**
 - 상세 설명 및 중요 요지
- **주요 키워드 2**
 - 상세 설명 및 중요 요지

[Input]
- 가이드 지침: ${contextInput.value}
- 전체 녹취록 기록: ${fullTranscript}`;

const result = await callGeminiAPI(prompt, fullTranscript);

if (result) {
finalSummaryRawMarkdown = result;
finalSummaryDiv.innerHTML = marked.parse(result);
document.getElementById('saveFinalSummaryDocBtn').disabled = false;
updateStatus('분석 요약 완료', 'idle');
if (fbDb) saveToFirebase(!!currentDocId);
} else {
updateStatus('분석 실패', 'idle');
}
}

window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (window.SpeechRecognition) {
recognition = new window.SpeechRecognition();
recognition.continuous = true;
recognition.interimResults = true; 
recognition.lang = 'ko-KR';
recognition.maxAlternatives = 1;

recognition.onstart = () => {
isRecognizing = true;
updateStatus('오디오 기록 중', 'recording');
};

recognition.onresult = (event) => {
networkErrorCount = 0; // Reset network error count on successful recognition
let finalChunk = '';
let hasFinal = false;
for (let i = event.resultIndex; i < event.results.length; ++i) {
if (event.results[i].isFinal) {
finalChunk += event.results[i][0].transcript + ' ';
hasFinal = true;
}
}

if (finalChunk) {
fullTranscript += finalChunk;

const pendingChunk = fullTranscript.substring(lastPolishedLength).trim();
// 문단 분리 로직: 400글자 이상 쌓였고 사용자가 말을 잠깐 쉬었을 때(hasFinal) 전송
// 혹은 랩하듯이 쉬지 않고 말해서 800글자를 넘기면 강제 전송
if ((pendingChunk.length >= 400 && hasFinal && !isPolishingChunk) || 
(pendingChunk.length >= 800 && !isPolishingChunk)) {
triggerChunkPolishing(false);
}
}

requestAnimationFrame(() => {
aiTranscriptContainer.scrollTop = aiTranscriptContainer.scrollHeight;
});
};

recognition.onerror = (e) => {
console.warn('Speech Recognition Error:', e.error);

if (e.error === 'not-allowed') {
showError('마이크 권한이 거부되었습니다. 마이크 입력을 허용해 주십시오.');
stopRecordingAndAnalyze();
} else if (e.error === 'network') {
hadNetworkError = true;
networkErrorCount++;
const now = Date.now();
console.log(`음성 인식 네트워크 끊김 (${networkErrorCount}회) → 자동 복구 시도`);
// 첫 끊김 시에만 사용자에게 알림 (반복 알림 방지)
if (networkErrorCount === 1) {
showToast('음성인식 네트워크가 일시적으로 끊겼습니다. 자동 재연결 중...', 'success');
} else if (networkErrorCount === 5) {
showError('네트워크 끊김이 반복되고 있습니다. 오디오 백업 녹음은 정상 진행 중이며, 자동 재연결을 계속 시도합니다.');
}
} else if (e.error === 'audio-capture') {
showError('마이크 오디오 캡처에 실패했습니다. 마이크 장치를 확인해 주십시오.');
stopRecordingAndAnalyze();
} else if (e.error === 'aborted') {
// 정상적인 중단 (stop 호출 등) - 무시
console.log('음성 인식이 중단되었습니다.');
}
};

recognition.onend = () => {
isRecognizing = false;

if (isRecording) {
// 지수 백오프: 끊김 횟수에 따라 대기 시간 증가 (최대 8초)
// 정상 종료(무음 끊김) 시 300ms, 네트워크 오류 시 점진적 증가
let restartDelay;
if (hadNetworkError) {
// 1회: 500ms → 2회: 1000ms → 3회: 2000ms → 4회+: 최대 8000ms
restartDelay = Math.min(500 * Math.pow(2, networkErrorCount - 1), 8000);
} else {
restartDelay = 300; // 일반 무음 끊김은 빠른 복구
networkErrorCount = 0; // 네트워크가 아닌 정상 끊김이면 카운트 리셋
}
hadNetworkError = false;
console.log(`음성 인식 재시작 예정 (${restartDelay}ms 후, 네트워크 오류 ${networkErrorCount}회)`);

setTimeout(() => {
if (isRecording && !isRecognizing) {
try { 
recognition.start(); 
console.log('음성 인식 재시작 성공');
} catch (err) {
console.error('음성 인식 재시작 실패:', err);
// 재시작 실패 시에도 다시 시도
setTimeout(() => {
if (isRecording && !isRecognizing) {
try { recognition.start(); } catch (e) {}
}
}, 2000);
}
}
}, restartDelay); 
}
};
}

if (mediaRecorder && mediaRecorder.state !== 'inactive') {

mediaRecorder.onstop = () => {
const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });

};
});

mediaRecorder.stop();
audioBlob = await recorderStopped;

// ── .docx 생성 (docx 라이브러리 사용) ────────────────────────────
function generateDocxFromMarkdown(markdownText, title) {
const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType } = docx;

const lines = markdownText.split('\n');
const docChildren = [];

lines.forEach(line => {
const trimmed = line.trim();
if (!trimmed) return;

if (trimmed.startsWith('# ')) {
docChildren.push(new Paragraph({
children: [new TextRun({ text: trimmed.replace(/^#+\s*/, ''), bold: true, size: 32, font: 'Malgun Gothic' })],
heading: HeadingLevel.HEADING_1,
spacing: { after: 200, before: 200 }
}));
} else if (trimmed.startsWith('## ')) {
docChildren.push(new Paragraph({
children: [new TextRun({ text: trimmed.replace(/^#+\s*/, ''), bold: true, size: 26, font: 'Malgun Gothic' })],
heading: HeadingLevel.HEADING_2,
spacing: { after: 150, before: 150 }
}));
} else if (trimmed.startsWith('### ')) {
docChildren.push(new Paragraph({
children: [new TextRun({ text: trimmed.replace(/^#+\s*/, ''), bold: true, size: 22, font: 'Malgun Gothic' })],
heading: HeadingLevel.HEADING_3,
spacing: { after: 100, before: 100 }
}));
} else if (trimmed.startsWith('> ')) {
docChildren.push(new Paragraph({
children: [new TextRun({ text: trimmed.replace(/^>\s*/, '').replace(/\*\*/g, ''), italics: true, size: 20, font: 'Malgun Gothic', color: '666666' })],
indent: { left: 720 },
spacing: { after: 100 }
}));
} else if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
const content = trimmed.replace(/^[-*]\s*/, '');
const runs = [];
const parts = content.split(/(\*\*[^*]+\*\*)/g);
parts.forEach(part => {
if (part.startsWith('**') && part.endsWith('**')) {
runs.push(new TextRun({ text: part.replace(/\*\*/g, ''), bold: true, size: 20, font: 'Malgun Gothic' }));
} else {
runs.push(new TextRun({ text: part, size: 20, font: 'Malgun Gothic' }));
}
});
docChildren.push(new Paragraph({
children: runs,
bullet: { level: 0 },
spacing: { after: 60 }
}));
} else {
const runs = [];
const parts = trimmed.split(/(\*\*[^*]+\*\*)/g);
parts.forEach(part => {
if (part.startsWith('**') && part.endsWith('**')) {
runs.push(new TextRun({ text: part.replace(/\*\*/g, ''), bold: true, size: 20, font: 'Malgun Gothic' }));
} else {
runs.push(new TextRun({ text: part, size: 20, font: 'Malgun Gothic' }));
}
});
docChildren.push(new Paragraph({
children: runs,
spacing: { after: 80 }
}));
}
});

const doc = new Document({
sections: [{
properties: {},
children: docChildren
}]
});

return Packer.toBlob(doc);
}

showError('오디오 파일 분석에 실패했습니다.');
}
} catch (err) {
console.error(err);
showError('오디오 파일 분석 도중 오류가 발생했습니다.');
} finally {
isProcessing = false;
isRecording = false;
recordBtn.classList.remove('opacity-75', 'cursor-not-allowed');
micIconContainer.innerHTML = '<i data-lucide="mic" class="h-4 w-4"></i>';
document.getElementById('recordBtnText').textContent = '녹음 시작';
updateStatus('AI 대기 중', 'idle');
lucide.createIcons();
e.target.value = '';
}
});

// ── Record button handler ───────────────────────────────────────
recordBtn.addEventListener('click', () => {
if (isProcessing) return;

if (isRecording) {
stopRecordingAndAnalyze();
} else {
if (!apiKeyInput.value.trim()) {
showError('Gemini API Key를 먼저 입력해주세요.');
return;
}

// Reset state for new recording
isRecording = true;
fullTranscript = '';
aiTranscript = '';
lastPolishedLength = 0;
lastProcessedLength = 0;
summaryHistory = [];
currentDocId = null;
networkErrorCount = 0;
hadNetworkError = false;

aiTranscriptContainer.innerHTML = '';
interimSummaryDiv.innerHTML = '';
finalSummaryDiv.innerHTML = '';

if (recognition) {
try {
recognition.start();
} catch (err) {
console.error('음성 인식 시작 실패:', err);
}
} else {
showError('브라우저가 음성 인식을 지원하지 않습니다. 크롬 브라우저를 사용해주세요.');
isRecording = false;
return;
}

// Start MediaRecorder for backup audio recording
navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
audioStream = stream;
audioChunks = [];
mediaRecorder = new MediaRecorder(stream);
mediaRecorder.ondataavailable = e => {
if (e.data.size > 0) audioChunks.push(e.data);
};
mediaRecorder.start();
}).catch(err => {
console.error('Mic access denied for MediaRecorder:', err);
});

document.getElementById('recordBtnText').textContent = '녹음 종료 및 분석';
recordBtn.classList.remove('bg-red-600/90', 'hover:bg-red-600');
recordBtn.classList.add('bg-slate-800', 'hover:bg-slate-700', 'border', 'border-red-500/40', 'pulse-live');
micIconContainer.innerHTML = '<i data-lucide="square" class="h-4 w-4 text-red-500 fill-current"></i>';
lucide.createIcons();
}
});

// ── Model list auto-fetch on API key blur ────────────────────────
document.getElementById('apiKey').addEventListener('blur', async () => {
const key = apiKeyInput.value.trim();
if (!key) return;

const select = document.getElementById('modelSelect');
const refreshBtn = document.getElementById('refreshModelsBtn');

try {
select.innerHTML = '<option value="">모델 조회 중...</option>';
const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
if (!resp.ok) throw new Error('API 조회 실패');
const data = await resp.json();

const models = (data.models || [])
.filter(m => m.supportedGenerationMethods?.includes('generateContent'))
.map(m => ({
id: m.name.replace('models/', ''),
name: m.displayName || m.name.replace('models/', '')
}))
.sort((a, b) => a.name.localeCompare(b.name));

select.innerHTML = '';
if (models.length === 0) {
select.innerHTML = '<option value="gemini-3.5-flash">Gemini 3.5 Flash (기본)</option>';
} else {
models.forEach(m => {
const opt = document.createElement('option');
opt.value = m.id;
opt.textContent = m.name;
// Auto-select flash model
if (m.id.includes('3.5-flash') && !m.id.includes('thinking')) opt.selected = true;
select.appendChild(opt);
});
}
refreshBtn.classList.remove('hidden');
} catch (err) {
console.error('모델 목록 조회 실패:', err);
select.innerHTML = '<option value="gemini-3.5-flash" selected>Gemini 3.5 Flash (기본)</option><option value="gemini-2.5-pro">Gemini 2.5 Pro</option><option value="gemini-2.5-flash">Gemini 2.5 Flash</option>';
refreshBtn.classList.remove('hidden');
}
});

// Refresh models button
document.getElementById('refreshModelsBtn').addEventListener('click', () => {
apiKeyInput.dispatchEvent(new Event('blur'));
});

// ── API Key toggle visibility ──────────────────────────────────
document.getElementById('toggleApiKey').addEventListener('click', () => {
const type = apiKeyInput.type === 'password' ? 'text' : 'password';
apiKeyInput.type = type;
document.getElementById('toggleApiKey').textContent = type === 'password' ? '보기' : '숨기기';
});

// ── Auto-connect Firebase from localStorage or default config ──
const savedProjectId = localStorage.getItem('fb_project_id');
const savedApiKey = localStorage.getItem('fb_api_key');
if (savedProjectId && savedApiKey) {
document.getElementById('fbProjectId').value = savedProjectId;
document.getElementById('fbApiKey').value = savedApiKey;
connectFirebase(savedProjectId, savedApiKey, true);
} else if (DEFAULT_FIREBASE_CONFIG.projectId && DEFAULT_FIREBASE_CONFIG.apiKey) {
document.getElementById('fbProjectId').value = DEFAULT_FIREBASE_CONFIG.projectId;
document.getElementById('fbApiKey').value = DEFAULT_FIREBASE_CONFIG.apiKey;
connectFirebase(DEFAULT_FIREBASE_CONFIG.projectId, DEFAULT_FIREBASE_CONFIG.apiKey, true);
}

// ── Persist Gemini API key in localStorage ──────────────────────
const savedGeminiKey = localStorage.getItem('gemini_api_key');
if (savedGeminiKey) {
apiKeyInput.value = savedGeminiKey;
// Trigger model fetch
setTimeout(() => apiKeyInput.dispatchEvent(new Event('blur')), 500);
}
apiKeyInput.addEventListener('change', () => {
const k = apiKeyInput.value.trim();
if (k) localStorage.setItem('gemini_api_key', k);
});

</script>
</body>
</html>
